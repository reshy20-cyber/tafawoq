<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تفوق">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>تفوق</title>
<meta name="theme-color" content="#078fc2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column (max 600px), sticky screen bar, fixed bottom tab bar. Exam mode hides the tab bar. */
:root{
  --bg:#f2f7fa;--surface:#ffffff;--surface-2:#e7f2f8;--line:#d5e5ee;
  --fg:#15324a;--muted:#5d7486;--accent:#078fc2;--accent-ink:#ffffff;--accent-soft:#dcf0fa;--accent-deep:#05668f;
  --good:#138a55;--good-soft:#e2f5ea;--bad:#c63c3c;--bad-soft:#fcebea;--warn:#a96f12;--warn-soft:#fff3dc;
  --paper:#fff7f2;--paper-line:#e7b4a2;--paper-ink:#8a3b25;--pencil:#26272c;--shadow:0 2px 10px rgba(16,60,90,.06);
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --font-math:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1820;--surface:#12232e;--surface-2:#173040;--line:#23404f;
  --fg:#e2edf4;--muted:#93aabb;--accent:#33b4e4;--accent-ink:#04202d;--accent-soft:#113b50;--accent-deep:#7fd0ef;
  --good:#4fc88b;--good-soft:#123528;--bad:#f08080;--bad-soft:#3a1c1f;--warn:#e6b45c;--warn-soft:#382b13;
  --paper:#26211f;--paper-line:#6d4b40;--paper-ink:#f0b9a5;--pencil:#f3ede6;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1820;--surface:#12232e;--surface-2:#173040;--line:#23404f;
  --fg:#e2edf4;--muted:#93aabb;--accent:#33b4e4;--accent-ink:#04202d;--accent-soft:#113b50;--accent-deep:#7fd0ef;
  --good:#4fc88b;--good-soft:#123528;--bad:#f08080;--bad-soft:#3a1c1f;--warn:#e6b45c;--warn-soft:#382b13;
  --paper:#26211f;--paper-line:#6d4b40;--paper-ink:#f0b9a5;--pencil:#f3ede6;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:19px}h3{font-size:16px}
p{margin:0}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.exam-mode .app{padding-bottom:24px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:14px;padding-block:14px 8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}

/* Hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:0 0 24px 24px;padding-block:22px 18px;display:grid;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:34px;letter-spacing:0}
.hero .sub{opacity:.9;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.16);padding:5px;border-radius:14px}
.seg button{border:0;background:transparent;color:inherit;border-radius:10px;padding:9px 4px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-deep);font-weight:700}
.countdown{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;text-align:center;font-size:12px;flex:none}
.countdown b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.2}

/* Cards & common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.row>*{min-width:0}
.muted{color:var(--muted);font-size:13px}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;border-radius:13px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.btn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.note{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}

/* Home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--font-display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:right;display:grid;gap:4px;box-shadow:var(--shadow)}
.tool .glyph{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);font-family:var(--font-display);font-weight:700;font-size:17px}
.tool b{font-size:15px}.tool span{font-size:12px;color:var(--muted)}
.tool.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tool.primary span{color:inherit;opacity:.85}.tool.primary .glyph{background:rgba(255,255,255,.2);color:inherit}
.subj{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;width:100%;text-align:right}
.glyph{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff;flex:none}
.subj .meta{flex:1;min-width:0}.subj .meta b{display:block}
.list{display:grid;gap:8px}

/* Sessions */
.session{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.session:first-child{border-top:0}
.session .time{font-family:var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;min-width:52px;font-weight:700;color:var(--accent-deep)}
.session .what{flex:1;min-width:0}
.session.done .what b{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;font-weight:700}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px;font-size:12px;text-align:center;line-height:1.4}
.day b{display:block;font-size:13px}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent-deep)}
.day small{display:block;font-size:11px;opacity:.75}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid .full{grid-column:1/-1}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:15px;color:var(--fg);min-width:0}

/* Exam setup */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:500}
.choice[aria-pressed="true"]{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent-deep);font-weight:700;padding:8px 13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:right;display:grid;gap:4px}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11px}
.mode b{font-size:15px}.mode span{font-size:12px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{right:23px}

/* Exam */
.exam-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.timer{font-family:var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:17px}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.qgrid{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qgrid::-webkit-scrollbar{display:none}
.qdot{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.qdot.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700}
.qdot.current{outline:2px solid var(--accent);outline-offset:1px}
.qdot.flagged::after{content:"";position:absolute;top:-3px;left:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.qtext{font-size:18px;font-weight:700;line-height:1.7}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:13px 12px;font-size:16px}
.opt .k{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:12px 11px}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.exam-foot{display:flex;gap:8px}.exam-foot .btn{flex:1}

/* Bubble sheet */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.booklet-q{display:grid;gap:6px;padding-block:12px;border-top:1px dashed var(--line)}
.booklet-q:first-child{border-top:0}
.booklet-q ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.booklet-q li{display:flex;gap:8px}
.booklet-q li .k{font-weight:700;color:var(--muted);min-width:20px}
.sheet{background:var(--paper);border:2px solid var(--paper-line);border-radius:6px;padding:14px 12px;display:grid;gap:12px;color:var(--fg)}
.sheet-head{border-bottom:2px solid var(--paper-line);padding-bottom:10px;display:grid;gap:8px}
.sheet-head h3{color:var(--paper-ink);font-size:15px;text-align:center}
.sheet-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--paper-ink)}
.sheet-fields .box{border:1px solid var(--paper-line);border-radius:4px;padding:6px 8px;background:transparent;min-width:0;width:100%;color:var(--fg);font-size:14px;font-variant-numeric:tabular-nums}
.sheet-rules{font-size:12px;color:var(--paper-ink);line-height:1.6}
.bubble-cols{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:520px){.bubble-cols{grid-template-columns:1fr 1fr}}
.brow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid color-mix(in srgb,var(--paper-line) 45%,transparent)}
.brow .n{width:26px;font-weight:700;color:var(--paper-ink);font-variant-numeric:tabular-nums;text-align:center;font-size:14px}
.brow .bubbles{display:flex;gap:8px;flex:1}
.bub{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--paper-ink);background:transparent;color:var(--paper-ink);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.bub.on{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}
.brow.invalid{background:var(--bad-soft)}
.brow .flagmini{font-size:11px;color:var(--bad);font-weight:700}

/* Result */
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .center b{font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums;display:block}
.verdict{text-align:center;display:grid;gap:4px}
.verdict .grade{font-family:var(--font-display);font-size:22px}
.meta4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meta4 div{background:var(--surface-2);border-radius:11px;padding:8px 2px;text-align:center;font-size:11px;color:var(--muted)}
.meta4 b{display:block;font-size:19px;color:var(--fg);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.meta4 .g b{color:var(--good)}.meta4 .r b{color:var(--bad)}
.rv{border-inline-start:4px solid var(--line)}
.rv.ok{border-inline-start-color:var(--good)}.rv.no{border-inline-start-color:var(--bad)}.rv.skip{border-inline-start-color:var(--warn)}
.ans{font-size:14px}.ans.right{color:var(--good)}.ans.wrong{color:var(--bad)}
.expl{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.barrow .track{height:10px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.barrow .track span{display:block;height:100%;border-radius:9px;background:var(--accent)}
.qfig{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);display:flex;justify-content:center}.qfig svg{height:auto}.lesson-u summary{gap:8px}.lesson-u .lesson-body{margin:10px 0}.essay-box{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--fg);font:inherit;resize:vertical;margin-bottom:10px}.model{border-inline-start:4px solid var(--good);background:var(--good-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.weak-row{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.weak-row:first-of-type{border-top:0}.weak-row .row{align-items:flex-start;gap:8px}.weak-row .row>span:first-child{min-width:0}.weak-row .pill{flex-shrink:0}.bank-q{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.barrow .v{font-variant-numeric:tabular-nums;text-align:left;direction:ltr;font-weight:700}

/* Lessons */
.lesson{display:grid;gap:10px}
.lesson summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-weight:700}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .num{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:13px;flex:none}
.lesson summary .done{margin-inline-start:auto}
.lesson[open] summary{margin-bottom:8px}
.lesson-body{display:grid;gap:10px}
.lesson h4{margin:0;font-size:14px;color:var(--accent-deep)}
.formula{direction:ltr;text-align:center;background:var(--surface-2);color:var(--fg);border-radius:11px;padding:10px 12px;overflow-x:auto;overflow-y:hidden}
/* chemical equations stay as upright text */
.formula.chem{font-family:var(--font-body);font-size:17px;font-weight:500;color:var(--accent-deep)}
math{font-family:'STIX Two Math','Cambria Math','Latin Modern Math',math,'Times New Roman',serif;font-weight:400;direction:ltr}
.formula math{font-size:1.3em;margin:0}
.opt math,.booklet-q math,.ans math,p math,li math{font-size:1.15em}
.msg.me math{color:inherit}
.practice{background:var(--surface-2);border-radius:13px;padding:12px;display:grid;gap:8px}
.popt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:right;width:100%}
.popt.ok{background:var(--good-soft);border:2px solid var(--good);color:var(--good);font-weight:700}
.popt.no{background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad)}
.fb{font-size:14px;display:grid;gap:6px}

/* Tutor */
.tutor{display:grid;gap:10px}
.chat{display:grid;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 13px;display:grid;gap:7px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:4px}
.msg.bot{justify-self:end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.msg .formula{font-size:14px}
.msg ul{margin:0;padding-inline-start:18px}
.msg details{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.msg .src{font-size:12px;color:var(--muted)}
.inline-math{direction:ltr;unicode-bidi:isolate;font-weight:600}
.thinking{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;max-height:130px;font-size:16px;line-height:1.5}
.status{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.on i{background:var(--good)}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;justify-items:center;gap:2px;padding:4px 0}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
body.exam-mode .nav{display:none}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,20,30,.45);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .card{width:100%;max-width:440px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
bdi{unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

 {q:'تمت معايرة `25 mL` من محلول NaOH تركيزه `0.2 M` بحمض HCl فاستُهلك `20 mL` من الحمض. تركيز الحمض يساوى:',a:['0.25 M','0.16 M','0.2 M','0.5 M'],e:'النسبة بين الحمض والقاعدة 1 : 1، إذن:\nM₁ V₁ = M₂ V₂\n0.2 × 25 = M₂ × 20\nM₂ = 5 / 20 = 0.25 M',ch:1}, // chem-u2-017
 {q:'كتلة هيدروكسيد الصوديوم (NaOH = 40 g/mol) اللازمة لتحضير `250 mL` من محلول تركيزه `0.1 M`:',a:['1 g','4 g','0.4 g','10 g'],e:'عدد المولات = التركيز × الحجم باللتر، والكتلة = المولات × الكتلة المولية:\nn = 0.1 × 0.25 = 0.025 mol\nm = 0.025 × 40 = 1 g',ch:1}, // chem-u2-018

 {q:'عند تسخين `2.5 g` من كلوريد الباريوم المتهدرت BaCl₂·xH₂O حتى ثبات الكتلة تبقى `2.13 g`. قيمة x تساوى تقريبًا: (Ba = 137 ، Cl = 35.5 ، H₂O = 18)',a:['2','1','3','5'],e:'كتلة الماء المفقود:\nm(H₂O) = 2.5 − 2.13 = 0.37 g\nn(H₂O) = 0.37 / 18 ≈ 0.0206 mol\nn(BaCl₂) = 2.13 / 208 ≈ 0.0102 mol\nx = 0.0206 / 0.0102 ≈ 2',ch:1}, // chem-u2-020

 {q:'عند الاتزان الكيميائى يكون:',a:['معدل التفاعل الطردى = معدل التفاعل العكسى','تركيز المتفاعلات = تركيز النواتج','التفاعل قد توقف تمامًا','معدل التفاعل الطردى أكبر من العكسى'],e:'الاتزان حالة ديناميكية تتساوى فيها سرعتا التفاعلين.',ch:2}, // chem-u3-002
 {q:'ينص قانون فعل الكتلة على أنه عند ثبوت درجة الحرارة تتناسب سرعة التفاعل الكيميائى طرديًا مع:',a:['حاصل ضرب التركيزات الجزيئية للمواد المتفاعلة كل مرفوع لأس يساوى عدد الجزيئات','مجموع التركيزات الجزيئية للنواتج','كتلة المواد المتفاعلة فقط','حجم الإناء'],e:'قانون جولدبرج وفاج.',ch:2}, // chem-u3-003

 {q:'إذا كانت قيمة ثابت الاتزان Kc كبيرة جدًا فإن ذلك يدل على أن:',a:['التفاعل يسير فى الاتجاه الطردى بدرجة كبيرة','التفاعل يسير فى الاتجاه العكسى','تركيز المتفاعلات عند الاتزان كبير','التفاعل بطىء جدًا'],e:'Kc الكبيرة تعنى أن تركيز النواتج عند الاتزان أكبر من تركيز المتفاعلات.',ch:2}, // chem-u3-005

 {q:'فى التفاعل N₂(g) + 3H₂(g) ⇌ 2NH₃(g) ، ΔH < 0 ، تزداد كمية النشادر الناتجة عند:',a:['زيادة الضغط وخفض درجة الحرارة','خفض الضغط ورفع درجة الحرارة','زيادة الضغط ورفع درجة الحرارة','إضافة عامل حفاز فقط'],e:'زيادة الضغط تزيح الاتزان نحو عدد مولات غازية أقل، والتفاعل طارد للحرارة فيفضله التبريد.',ch:2}, // chem-u3-009

 {q:'فى التفاعل 2NO₂(g) ⇌ N₂O₄(g) ، عند خفض درجة الحرارة يقل اللون البنى المحمر للخليط، معنى ذلك أن التفاعل الطردى:',a:['طارد للحرارة','ماص للحرارة','لا يتأثر بالحرارة','يحدث فقط فى وجود حفاز'],e:'التبريد يزيح الاتزان فى الاتجاه الطارد للحرارة؛ وتكوّن N₂O₄ عديم اللون هو الاتجاه الطردى.',ch:2}, // chem-u3-011

 {q:'حمض ضعيف أحادى البروتون تركيزه `0.1 M` وثابت تأينه Ka = 1.8 × 10⁻⁵. تركيز أيون الهيدرونيوم يساوى تقريبًا:',a:['1.34 × 10⁻³ M','1.8 × 10⁻⁶ M','4.2 × 10⁻³ M','1.34 × 10⁻² M'],e:'للحمض الضعيف:\n[H⁺] = √(Ka × Ca)\n[H⁺] = √(1.8 × 10⁻⁵ × 0.1) ≈ 1.34 × 10⁻³ M',ch:2}, // chem-u3-014
 {q:'محلول تركيز أيون الهيدروكسيد فيه 1 × 10⁻³ M ، قيمة pH له:',a:['11','3','7','14'],e:'pOH = −log [OH⁻] = −log 10⁻³ = 3\npH = 14 − pOH = 14 − 3 = 11',ch:2}, // chem-u3-016

 {q:'تفاعلات الألكانات المميزة هى تفاعلات:',a:['الاستبدال','الإضافة','البلمرة بالإضافة','الهيدرة'],e:'الألكانات مشبعة؛ فتفاعلها مع الهالوجينات فى الضوء يكون بالاستبدال.',ch:4}, // chem-u5-005
 {q:'الاسم الصحيح طبقًا للأيوباك للمركب CH₃–CH(CH₃)–CH₂–CH₃ هو:',a:['2-ميثيل بيوتان','3-ميثيل بيوتان','بنتان','2-إيثيل بروبان'],e:'أطول سلسلة 4 ذرات كربون، وترقم من الطرف الأقرب للتفرع.',ch:4}, // chem-u5-006
 {q:'يُحضر الإيثين فى المعمل بنزع الماء من الإيثانول باستخدام حمض الكبريتيك المركز عند:',a:['180°C','140°C','100°C','25°C'],e:'عند 180°C يتكون الإيثين، بينما عند 140°C يتكون ثنائى إيثيل إيثر.',ch:4}, // chem-u5-007
 {q:'طبقًا لقاعدة ماركونيكوف، ناتج إضافة HBr إلى البروبين هو:',a:['2-برومو بروبان','1-برومو بروبان','1،2-ثنائى برومو بروبان','بروبان'],e:'ذرة الهيدروجين تُضاف إلى ذرة الكربون الأغنى بالهيدروجين.',ch:4}, // chem-u5-008
 {q:'فى تفاعل باير يتفاعل الإيثين مع البرمنجنات القلوية فيتكون:',a:['إيثيلين جليكول','الإيثانول','حمض الأسيتيك','الأسيتالدهيد'],e:'يزول اللون البنفسجى للبرمنجنات، ويُستخدم للكشف عن عدم التشبع.',ch:4}, // chem-u5-009
 {q:'يُستخدم ............ للكشف عن عدم التشبع، حيث يزول لونه الأحمر عند إضافته للألكين.',a:['البروم المذاب فى رابع كلوريد الكربون','محلول كلوريد الحديد (III)','ماء الجير','محلول نترات الفضة'],e:'تفاعل إضافة البروم على الرابطة المزدوجة.',ch:4}, // chem-u5-010
 {q:'يُحضر غاز الأسيتيلين فى المعمل بتفاعل الماء مع:',a:['كربيد الكالسيوم','أسيتات الصوديوم','كربونات الكالسيوم','الإيثانول'],e:'CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂',ch:4}, // chem-u5-011
 {q:'ناتج هيدرة الأسيتيلين حفزيًا (H₂SO₄ 40% و HgSO₄ عند `60°C`) هو:',a:['الأسيتالدهيد','الإيثانول','إيثيلين جليكول','الأسيتون'],e:'يتكون كحول الفينيل غير الثابت الذى يتحول إلى أسيتالدهيد، ويُستغل فى صناعة حمض الإيثانويك.',ch:4}, // chem-u5-012
 {q:'يُحضر البنزين العطرى نقيًا فى المختبر بالتقطير الجاف لـ:',a:['بنزوات الصوديوم مع الجير الصودى','أسيتات الصوديوم مع الجير الصودى','الفينول مع الخارصين فقط','الطولوين مع حمض النيتريك'],e:'C₆H₅COONa + NaOH → C₆H₆ + Na₂CO₃',ch:4}, // chem-u5-013
 {q:'البنزين ثنائى الاستبدال الذى تكون فيه المجموعتان على ذرتى الكربون 1 و 4 يُسمى:',a:['بارا','أورثو','ميتا','ثلاثى الاستبدال'],e:'أورثو: 1،2 – ميتا: 1،3 – بارا: 1،4.',ch:4}, // chem-u5-014
 {q:'تفاعل البنزين مع كلوريد الميثيل فى وجود كلوريد الألومنيوم اللامائى يُسمى:',a:['الألكلة (فريدل-كرافتس)','الهلجنة','النيترة','السلفنة'],e:'يتكون الطولوين (ميثيل بنزين) و HCl.',ch:4}, // chem-u5-015
 {q:'الكحول الذى ترتبط فيه ذرة الكربون الحاملة لمجموعة الهيدروكسيل بثلاث مجموعات ألكيل هو كحول:',a:['ثالثى','أولى','ثانوى','ثنائى الهيدروكسيل'],e:'مثل 2-ميثيل-2-بروبانول.',ch:4}, // chem-u5-016
 {q:'أكسدة الكحول الثانوى بثانى كرومات البوتاسيوم المحمضة تعطى:',a:['كيتون','ألدهيد ثم حمض كربوكسيلى','لا يتأكسد','إستر'],e:'الكحول الأولى ← ألدهيد ← حمض، الثانوى ← كيتون، الثالثى لا يتأكسد.',ch:4}, // chem-u5-017
 {q:'يتفاعل الإيثانول مع فلز الصوديوم فيتكون:',a:['إيثوكسيد الصوديوم ويتصاعد الهيدروجين','هيدروكسيد الصوديوم والإيثين','أسيتات الصوديوم والماء','كلوريد الإيثيل'],e:'يدل على الصفة الحمضية الضعيفة للكحولات:\n2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂',ch:4}, // chem-u5-018
 {q:'البكاليت بوليمر شبكى يُحضر بتكاثف الفينول مع:',a:['الفورمالدهيد','الأسيتالدهيد','الإيثيلين','حمض الأسيتيك'],e:'بلمرة بالتكاثف تُكون بلاستيكًا شبكيًا صلبًا.',ch:4}, // chem-u5-019
 {q:'الفينول أكثر حمضية من الكحولات، لذلك يتفاعل مع:',a:['محلول هيدروكسيد الصوديوم مكونًا فينوكسيد الصوديوم','حمض الهيدروكلوريك مكونًا كلوريد الفينيل','كربونات الصوديوم ويتصاعد CO₂','الماء مكونًا هيدروكسيد الفينيل'],e:'الكحولات لا تتفاعل مع NaOH، والفينول حمض أضعف من حمض الكربونيك فلا يُطلق CO₂.',ch:4}, // chem-u5-020
 {q:'يُكشف عن الأحماض الكربوكسيلية بإضافة محلول بيكربونات الصوديوم فيحدث:',a:['فوران ويتصاعد غاز CO₂ يعكر ماء الجير','تكون راسب أبيض','تكون لون بنفسجى','تصاعد غاز الهيدروجين'],e:'يتصاعد CO₂ الذي يعكر ماء الجير:\nRCOOH + NaHCO₃ → RCOONa + H₂O + CO₂',ch:4}, // chem-u5-022
 {q:'حمض اللاكتيك يتكون فى العضلات عند الإجهاد ويوجد فى:',a:['اللبن الرائب','الخل','النمل','الليمون'],e:'ينتج من تخمر سكر اللبن (اللاكتوز).',ch:4}, // chem-u5-023
 {q:'التحلل المائى للدهون والزيوت فى وسط قلوى (NaOH) يُسمى:',a:['التصبن','الأسترة','الهدرجة','البلمرة'],e:'ينتج الصابون (أملاح أحماض دهنية) والجلسرين.',ch:4}, // chem-u5-025
 {q:'زيت المروخ (زيت الشتاء) يُحضر من تفاعل حمض السلسليك مع:',a:['الميثانول','الإيثانول','حمض الأسيتيك','الجلسرين'],e:'يتكون سلسلات الميثيل، المادة الفعالة فى الدهانات المسكنة.',ch:4}, // chem-u5-026,

physics:[
 {q:'ما وحدة قياس شدة التيار؟',a:['الأمبير','الفولت','الأوم','الجول'],e:'شدة التيار تقاس بالأمبير.',ch:0},
 {q:'مرت شحنة 60 كولوم في 20 ثانية. ما شدة التيار؟',a:['3 أمبير','12 أمبير','40 أمبير','80 أمبير'],e:'I = Q / t = 60 / 20 = 3 A',ch:0},
 {q:'ما وحدة قياس فرق الجهد؟',a:['الفولت','الأوم','الوات','الكولوم'],e:'فرق الجهد يقاس بالفولت.',ch:0},
 {q:'إذا كان فرق الجهد 12 فولت والمقاومة 4 أوم، فما شدة التيار؟',a:['3 أمبير','48 أمبير','8 أمبير','16 أمبير'],e:'I = V / R = 12 / 4 = 3 A',ch:0},
 {q:'عند مضاعفة طول سلك مع ثبات باقي العوامل، فإن مقاومته:',a:['تتضاعف','تقل للنصف','لا تتغير','تصبح صفراً'],e:'المقاومة تتناسب طردياً مع طول السلك:\nR = ρ L / A',ch:0},
 {q:'مقاومتان 2 أوم و3 أوم على التوالي. ما المقاومة المكافئة؟',a:['5 أوم','1 أوم','6 أوم','1.2 أوم'],e:'على التوالي نجمع المقاومات:\nRₑ = 2 + 3 = 5 Ω',ch:0},
 {q:'مقاومتان 6 أوم و3 أوم على التوازي. ما المقاومة المكافئة؟',a:['2 أوم','9 أوم','3 أوم','18 أوم'],e:'نجمع مقلوبات المقاومات:\n1/Rₑ = 1/6 + 1/3 = 1/2  ⇒  Rₑ = 2 Ω',ch:0},
 {q:'في التوصيل على التوازي تكون الكمية المتساوية في جميع الفروع:',a:['فرق الجهد','شدة التيار','المقاومة','القدرة'],e:'فرق الجهد واحد على كل فروع التوازي، ويتوزع التيار بينها.',ch:0},
 {q:'بطارية قوتها الدافعة 10 فولت ومقاومتها الداخلية 1 أوم والخارجية 4 أوم. ما التيار؟',a:['2 أمبير','2.5 أمبير','10 أمبير','40 أمبير'],e:'I = E / (R + r) = 10 / (4 + 1) = 2 A',ch:0},
 {q:'يدخل عقدة تيار 7 أمبير ويخرج منها 3 أمبير في فرع. ما تيار الفرع الآخر؟',a:['4 أمبير','10 أمبير','21 أمبير','3 أمبير'],e:'من قانون كيرتشوف الأول:\n7 = 3 + I  ⇒  I = 4 A',ch:0},
 {q:'المجموع الجبري لتغيرات الجهد في مسار مغلق يساوي:',a:['صفراً','1 فولت','القوة الدافعة دائماً','المقاومة الكلية'],e:'طبقاً لقانون كيرتشوف الثاني:\nΣ ΔV = 0',ch:0},
 {q:'مقاومة 5 أوم يمر بها تيار 2 أمبير. ما فرق الجهد بين طرفيها؟',a:['10 فولت','2.5 فولت','7 فولت','3 فولت'],e:'V = I R = 2 × 5 = 10 V',ch:0},
 {q:'ما وحدة قياس القدرة الكهربية؟',a:['الوات','الأوم','الكولوم','الفولت'],e:'القدرة تقاس بالوات، والوات = جول / ثانية.',ch:0},
 {q:'الجهاز المستخدم لقياس المقاومة الكهربية مباشرة هو:',a:['الأوميتر','الفولتميتر','الأميتر','البارومتر'],e:'الأوميتر يقيس المقاومة، والأميتر التيار، والفولتميتر فرق الجهد.',ch:1},
 {q:'إذا تضاعفت المقاومة مع ثبات فرق الجهد، فإن شدة التيار:',a:['تقل للنصف','تتضاعف','لا تتغير','تصبح صفراً'],e:'من قانون أوم:\nI = V / R\nفالتيار يتناسب عكسياً مع المقاومة.',ch:0},
 {q:'تتناسب كثافة الفيض المغناطيسي عند نقطة قرب سلك مستقيم طويل يمر به تيار:',a:['طردياً مع شدة التيار وعكسياً مع البعد العمودي عن السلك','عكسياً مع شدة التيار وطردياً مع البعد','طردياً مع مربع شدة التيار','لا تعتمد على البعد عن السلك'],e:'B = μ I / (2π d)',ch:1},
 {q:'وحدة قياس كثافة الفيض المغناطيسي هي:',a:['التسلا','الويبر','الهنري','الفاراد'],e:'التسلا = ويبر لكل متر مربع. الويبر وحدة الفيض نفسه.',ch:1},
 {q:'سلك يمر به تيار وُضع موازياً لخطوط فيض مغناطيسي منتظم. القوة المغناطيسية المؤثرة عليه:',a:['صفر','أقصى ما يمكن','نصف القيمة العظمى','تساوي B I L دائماً'],e:'القوة تساوي `F = B I L sin θ`، وعندما يكون السلك موازياً للفيض تكون `θ = 0` فتنعدم القوة.',ch:1},
 {q:'سلكان متوازيان يمر بهما تياران في الاتجاه نفسه:',a:['يتجاذبان','يتنافران','لا تؤثر بينهما قوة','يدوران حول بعضهما'],e:'التياران المتوازيان في اتجاه واحد يتجاذبان، وفي اتجاهين متضادين يتنافران.',ch:1},
 {q:'لتحويل الجلفانومتر إلى أميتر نوصل به:',a:['مقاومة صغيرة على التوازي (مجزئ تيار)','مقاومة كبيرة على التوالي (مضاعف جهد)','مقاومة كبيرة على التوازي','بطارية على التوالي'],e:'مجزئ التيار يمرر معظم التيار بعيداً عن ملف الجلفانومتر فيتسع مدى القياس.',ch:1},
 {q:'لتحويل الجلفانومتر إلى فولتميتر نوصل به:',a:['مقاومة كبيرة على التوالي (مضاعف جهد)','مقاومة صغيرة على التوازي','مكثفاً على التوالي','ملفاً حثياً على التوازي'],e:'مضاعف الجهد يتحمل معظم فرق الجهد فيتسع مدى قياس الجهد.',ch:1},
 {q:'عند مضاعفة عدد لفات وحدة الأطوال لملف حلزوني مع ثبات التيار، فإن كثافة الفيض داخله:',a:['تتضاعف','تقل للنصف','لا تتغير','تزداد أربع مرات'],e:'كثافة الفيض داخل الملف الحلزوني:\nB = μ N I / L',ch:1},
 {q:'ملف عدد لفاته 100 لفة، يتغير الفيض المغناطيسي خلاله بمعدل 0.02 Wb/s. القوة الدافعة المستحثة:',a:['2 فولت','0.2 فولت','20 فولت','5000 فولت'],e:'من قانون فاراداي:\nemf = N ΔΦ / Δt = 100 × 0.02 = 2 V',ch:2},
 {q:'يتحدد اتجاه التيار المستحث في ملف بقاعدة:',a:['لنز','أمبير لليد اليمنى','فلمنج لليد اليسرى','كيرتشوف'],e:'قاعدة لنز: يكون اتجاه التيار المستحث بحيث يقاوم التغير المسبب له.',ch:2},
 {q:'محول رافع، عدد لفات ملفه الابتدائي 100 والثانوي 500، والجهد الابتدائي 220 فولت. الجهد الثانوي:',a:['1100 فولت','44 فولت','220 فولت','550 فولت'],e:'في المحول المثالي:\nVs / Vp = Ns / Np\nVs = 220 × 500 / 100 = 1100 V',ch:2},
 {q:'لا يعمل المحول الكهربي مع التيار المستمر لأن التيار المستمر:',a:['لا يولد فيضاً مغناطيسياً متغيراً','لا يولد أي فيض مغناطيسي','شدته صغيرة دائماً','يتلف القلب الحديدي'],e:'الحث المتبادل يحتاج فيضاً متغيراً، والتيار المستمر الثابت يولد فيضاً ثابتاً.',ch:2},
 {q:'يُصنع القلب الحديدي للمحول من شرائح رقيقة معزولة بهدف تقليل:',a:['التيارات الدوامية','عدد اللفات','الجهد الثانوي','التردد'],e:'الشرائح المعزولة تزيد مقاومة مسارات التيارات الدوامية فتقل الطاقة المفقودة حرارةً.',ch:2},
 {q:'يحول الدينامو (المولد الكهربي):',a:['الطاقة الحركية إلى طاقة كهربية','الطاقة الكهربية إلى حركية','الطاقة الضوئية إلى كهربية','الطاقة الحرارية إلى كيميائية'],e:'يدور الملف في مجال مغناطيسي فتتولد فيه قوة دافعة مستحثة.',ch:2},
 {q:'تيار متردد قيمته العظمى 10 أمبير. قيمته الفعالة تقريباً:',a:['7.07 أمبير','10 أمبير','14.1 أمبير','5 أمبير'],e:'I_eff = 0.707 × I_max = 0.707 × 10 ≈ 7.07 A',ch:3},
 {q:'عند زيادة تردد التيار المتردد المار في ملف حثي، فإن مفاعلته الحثية:',a:['تزداد','تقل','لا تتغير','تنعدم'],e:'X_L = 2π f L فالمفاعلة الحثية تتناسب طردياً مع التردد.',ch:3},
 {q:'عند زيادة تردد التيار المتردد المار في مكثف، فإن مفاعلته السعوية:',a:['تقل','تزداد','لا تتغير','تصبح لا نهائية'],e:'X_C = 1 / (2π f C) فالمفاعلة السعوية تتناسب عكسياً مع التردد.',ch:3},
 {q:'في دائرة تيار متردد بها ملف حثي مهمل المقاومة فقط، فإن التيار:',a:['يتأخر عن الجهد بزاوية 90°','يسبق الجهد بزاوية 90°','يتفق مع الجهد في الطور','يسبق الجهد بزاوية 180°'],e:'في الملف الحثي النقي يتأخر التيار عن الجهد بربع دورة، وفي المكثف يسبقه بربع دورة.',ch:3},
 {q:'دائرة RLC فيها R = 3 Ω و X_L − X_C = 4 Ω. المعاوقة الكلية:',a:['5 أوم','7 أوم','1 أوم','12 أوم'],e:'Z = √(R² + (X_L − X_C)²) = √(9 + 16) = 5 Ω',ch:3},

const LESSONS={
 arabic:['الكلام المفيد ما تركب من كلمتين أو أكثر وأفاد معنى تاماً يحسن السكوت عليه، مثل: «الوطنُ غالٍ».\n- أقسام الكلمة ثلاثة: اسم وفعل وحرف.\n- علامات الاسم: الجر، والتنوين، و«أل»، والنداء، والإسناد إليه.\n- علامات الماضي: تاء الفاعل وتاء التأنيث الساكنة. وعلامة المضارع: قبول «لم». وعلامة الأمر: الدلالة على الطلب مع قبول ياء المخاطبة أو نون التوكيد.\n- الحرف لا يقبل علامات الاسم ولا الفعل، ومعناه يظهر مع غيره.','ينقسم الاسم باعتبارات مختلفة:\n- من حيث آخره: صحيح الآخر، ومقصور (آخره ألف لازمة: الهدى)، ومنقوص (آخره ياء لازمة مكسور ما قبلها: القاضي)، وممدود (آخره همزة قبلها ألف زائدة: الصحراء).\n- من حيث العدد: مفرد ومثنى وجمع (مذكر سالم، مؤنث سالم، تكسير).\n- من حيث التعريف: نكرة ومعرفة. والمعارف: الضمير، والعلم، واسم الإشارة، والاسم الموصول، والمعرّف بأل، والمضاف إلى معرفة.\n- عند التثنية: تُرد ياء المنقوص (القاضيان)، وتُقلب ألف المقصور ياءً أو واواً حسب أصلها (فتيان، عصوان).','الفعل من حيث الزمن: ماضٍ ومضارع وأمر.\n- من حيث الصحة والاعتلال: الصحيح (سالم: كتب، مهموز: أخذ، مضعف: شدّ)، والمعتل (مثال: وعد، أجوف: قال، ناقص: دعا، لفيف مفروق: وقى، لفيف مقرون: طوى).\n- من حيث التعدي: لازم يكتفي بفاعله (نام)، ومتعدٍّ يحتاج مفعولاً به (قرأ الكتاب).\n- من حيث التصرف: متصرف، وجامد لا يتغير مثل: ليس، نِعم، بئس، عسى.','المعرب ما يتغير آخره بتغير موقعه، والمبني ما يلزم آخره حالة واحدة.\n- الماضي مبني دائماً: على الفتح أصلاً، وعلى الضم مع واو الجماعة، وعلى السكون مع ضمائر الرفع المتحركة.\n- الأمر مبني على ما يُجزم به مضارعه: السكون، أو حذف حرف العلة، أو حذف النون.\n- المضارع معرب إلا مع نون النسوة (يبنى على السكون) ونون التوكيد المباشرة (يبنى على الفتح).\n- من الأسماء المبنية: الضمائر، وأسماء الإشارة (عدا المثنى)، والأسماء الموصولة (عدا المثنى)، وأسماء الشرط والاستفهام.\n- العلامات الفرعية: المثنى بالألف والياء، وجمع المذكر بالواو والياء، والأسماء الخمسة بالواو والألف والياء، والأفعال الخمسة بثبوت النون وحذفها.','مرفوعات الأسماء سبعة: الفاعل، ونائب الفاعل، والمبتدأ، والخبر، واسم كان وأخواتها، وخبر إن وأخواتها، وخبر لا النافية للجنس، بالإضافة إلى التابع للمرفوع.\n- نائب الفاعل: يحل محل الفاعل بعد حذفه، والفعل مبني للمجهول (كُتِبَ الدرسُ).\n- الخبر قد يكون مفرداً أو جملة أو شبه جملة، وقد يتقدم على المبتدأ النكرة (في الحديقة أزهارٌ).\n- علامة الرفع الأصلية الضمة، والفرعية الألف والواو وثبوت النون.','المنصوبات: المفاعيل الخمسة (المفعول به، المفعول المطلق، المفعول لأجله، المفعول فيه، المفعول معه)، والحال، والتمييز، والمستثنى، وخبر كان، واسم إن، واسم لا النافية للجنس.\n- المفعول المطلق: مصدر من لفظ الفعل يؤكده أو يبين نوعه أو عدده.\n- المفعول لأجله: مصدر قلبي يبين سبب الفعل (وقفتُ احتراماً).\n- الحال: وصف نكرة يبين هيئة صاحبه المعرفة.\n- التمييز: نكرة تزيل الإبهام عن ذات أو نسبة (اشتريت عشرين كتاباً).\n- المستثنى بإلا: يجب نصبه إذا كان الكلام تاماً مثبتاً.','يُجر الاسم في موضعين: بحرف الجر (ذهبتُ إلى المدرسةِ)، وبالإضافة (كتابُ الطالبِ).\n- علامة الجر الأصلية الكسرة، والفرعية: الياء (المثنى وجمع المذكر والأسماء الخمسة)، والفتحة (الممنوع من الصرف).\n- يُجر الممنوع من الصرف بالكسرة إذا عُرف بأل أو أُضيف.\n- المضاف يُحذف تنوينه، وتُحذف نون المثنى والجمع منه عند الإضافة (معلمو المدرسة).','التوابع أربعة تتبع ما قبلها في الإعراب:\n- النعت: يتبع المنعوت في الإعراب والتعريف والتنكير والعدد والنوع (طالبٌ مجتهدٌ).\n- التوكيد: لفظي بتكرار اللفظ، ومعنوي بألفاظ: نفس، عين، كل، جميع، كلا، كلتا.\n- العطف: بحروف منها الواو (مطلق الجمع)، والفاء (ترتيب وتعقيب)، وثم (ترتيب وتراخٍ)، وأو، وأم، وبل، ولكن، ولا.\n- البدل: مطابق (كل من كل)، وبعض من كل، واشتمال، وفي الأخيرين ضمير يعود على المبدل منه.','من أهم الأساليب:\n- التعجب القياسي: «ما أفعلَه!» و«أفعِلْ به!»، مثل: ما أجملَ السماءَ! أكرِمْ بالعلماء!\n- المدح والذم: نعم وبئس، وحبذا ولا حبذا (نعم الخلقُ الصدقُ).\n- الاختصاص: اسم منصوب بفعل محذوف تقديره «أخص» بعد ضمير (نحن ـ المصريين ـ نحب وطننا).\n- الإغراء: حث على أمر محمود (الصدقَ الصدقَ)، والتحذير: تنبيه على مكروه (الأسدَ الأسدَ، إياك والكذبَ).\n- الشرط: أداة شرط جازمة تجزم فعلين (إن تجتهد تنجح)، أو غير جازمة (إذا، لو، لولا).\n- القسم والاستفهام.','جمل لها محل من الإعراب (تُعرب لأنها تحل محل المفرد):\n- الخبرية (في محل رفع)، والحالية (نصب)، والمفعولية ومنها مقول القول (نصب)، والمضاف إليها بعد إذ وإذا وحيث (جر)، والنعت بعد النكرة، وجواب الشرط الجازم المقترن بالفاء أو إذا (جزم).\nجمل لا محل لها:\n- الابتدائية، والاعتراضية، والتفسيرية، وصلة الموصول، وجواب القسم، وجواب الشرط غير الجازم أو غير المقترن بالفاء.\nقاعدة مهمة: الجملة بعد النكرة نعت، وبعد المعرفة حال.','الميزان الصرفي: «ف ع ل» يقابل أصول الكلمة، وتُزاد في الميزان الحروف الزائدة بلفظها (مكتوب: مفعول، استغفر: استفعل). وإذا حُذف حرف أصلي حُذف مقابله (قُل: فُل).\nالمشتقات:\n- اسم الفاعل: من الثلاثي على «فاعل» (كاتب)، ومن غيره على صيغة المضارع بميم مضمومة وكسر ما قبل الآخر (مُستخرِج).\n- اسم المفعول: من الثلاثي على «مفعول»، ومن غيره بفتح ما قبل الآخر (مُستخرَج).\n- صيغ المبالغة: فعّال، مِفعال، فعول، فعيل، فَعِل.\n- الصفة المشبهة: صفة ثابتة (جميل). اسم التفضيل: «أفعل» (أكبر).\n- اسما الزمان والمكان: مَفعَل ومَفعِل (ملعب، موعد). اسم الآلة: مِفعال، مِفعل، مِفعلة (مفتاح، مبرد، مكنسة).','همزة الوصل: تُنطق في أول الكلام وتسقط في وصله، ولا تُكتب عليها همزة.\n- مواضعها: أمر الثلاثي (اكتب)، وماضي الخماسي والسداسي وأمرهما ومصدرهما (انطلق، استخرج، انطلاق، استخراج)، و«أل» التعريف، والأسماء العشرة (اسم، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، است، ابنم، ايمن الله).\nهمزة القطع: تُنطق دائماً وتُكتب (أ، إ).\n- مواضعها: الضمائر (أنت)، والحروف (إنّ، أنْ)، والأسماء (عدا العشرة)، وماضي الرباعي وأمره ومصدره (أكرم، إكرام)، وهمزة المضارع للمتكلم (أكتب).','علامات الترقيم تنظم الكلام وتوضح المعنى:\n- النقطة (.) في نهاية الجملة التامة. والفاصلة (،) بين الجمل المتعاطفة وبعد المنادى.\n- الفاصلة المنقوطة (؛) بين جملتين الثانية سبب للأولى أو نتيجة لها.\n- النقطتان (:) بعد القول وقبل التقسيم والأمثلة.\n- علامة الاستفهام (؟) والتعجب (!).\n- الشرطتان (ـ ـ) حول الجملة الاعتراضية، والقوسان ( ) حول الكلمات التفسيرية، وعلامتا التنصيص « » حول الكلام المنقول بنصه، وعلامة الحذف (...).','موضوعات القراءة في كتاب الوزارة:\n- «إرادة التغيير» لزكي نجيب محمود: الإرادة هي العمل الذي يحقق الهدف، وكل إرادة فعل وكل فعل تغيير، ولا تعارض بين حرية الفرد والتزامه بقواعد المجموع.\n- «أبو الريحان البيروني»: عالم موسوعي وُلد قرب خوارزم، وأقام في الهند زمناً طويلاً، وكتب معظم مؤلفاته بالعربية في الفلك والرياضيات والتاريخ والجغرافيا، وتميز بالصبر والدقة.\n- «القدس مدينة عربية إسلامية»: العهدة العمرية لأهل إيلياء، وصلاة عمر خارج كنيسة القيامة، وبناء عبد الملك بن مروان لقبة الصخرة، وانتصار صلاح الدين في حطين ودخوله القدس.\n- «العلم في الإسلام»: الإسلام يحث على العلوم الدينية والكونية معاً، والشورى، ولا حد لما يستنبطه العقل.\n- «قيم إنسانية»: قيم التسامح والتعاون والرحمة.','مدارس الشعر العربي الحديث:\n- الإحياء والبعث: أعادت للشعر قوته باحتذاء القدماء. رائدها البارودي، ومن أعلامها شوقي وحافظ. وجيل التطوير بقيادة شوقي أضاف المسرح الشعري. نص «غربة وحنين» قاله شوقي في منفاه بالأندلس معارضاً سينية البحتري.\n- الاتجاه الوجداني: خليل مطران، اهتم بالذات والطبيعة والوحدة العضوية. نص «المساء» قاله مريضاً بالإسكندرية.\n- الديوان: العقاد والمازني وشكري، نقدوا شعر الإحياء ودعوا إلى الوحدة العضوية وشعر الوجدان. نص «في رثاء مي» للعقاد.\n- أبولو: أسسها أحمد زكي أبو شادي، وجمعت شعراء الوجدان (ناجي، الشابي، علي محمود طه). نص «أهواك يا وطني» لمحمود حسن إسماعيل.\n- المهجر: الرابطة القلمية في نيويورك (جبران ونعيمة)، والعصبة الأندلسية في أمريكا الجنوبية. نص «من أنت يا نفسي» لميخائيل نعيمة.\n- الواقعية والشعر الجديد: شعر التفعيلة الذي لا يلتزم بعدد ثابت من التفعيلات، ومن رواده نازك الملائكة والسياب. نص «النسور» لمحمد إبراهيم أبو سنة.','فنون النثر الحديث:\n- المقال: معالجة فكرة واحدة بإيجاز في مقدمة وعرض وخاتمة. نص «التكافل الاجتماعي في الإسلام» لأحمد حسن الزيات.\n- الرواية: عمل طويل تتعدد فيه الأحداث والشخصيات. أول رواية فنية «زينب» لمحمد حسين هيكل.\n- القصة القصيرة: تقوم على حدث أو موقف واحد ووحدة الانطباع. من روادها محمد تيمور («في القطار»). نص «الكنيسة نورت» لإبراهيم أصلان.\n- المسرحية: تقوم على الحوار والصراع وتُكتب للتمثيل. رائد المسرح النثري توفيق الحكيم («الصفقة»)، ورائد المسرح الشعري أحمد شوقي.\n- عناصر القصة: الحدث، والشخصيات، والزمان والمكان، والحبكة (العقدة والحل)، والأسلوب.','مفاهيم نقدية:\n- التجربة الشعرية: الصورة الكاملة النفسية أو الكونية التي يصورها الشاعر حين يفكر في أمر ما تفكيراً ينم عن عمق شعوره وإحساسه. عناصرها: العاطفة، والفكرة، والصورة، والموسيقى، واللغة. ومعيارها الصدق الفني.\n- الوحدة الفنية (العضوية): أن تكون القصيدة بنية حية متماسكة، تتحقق بوحدة الموضوع ووحدة الجو النفسي، فلا يمكن حذف بيت أو تقديمه أو تأخيره دون أن يختل المعنى.\n- الصورة الكلية: لوحة متكاملة تتآزر فيها الصور الجزئية (التشبيه والاستعارة والكناية) والألوان والحركة والأصوات.','«الأيام» سيرة ذاتية لطه حسين، والسيرة الذاتية قصة حياة يرويها صاحبها بنفسه معتمداً على ذاكرته.\nالجزء الأول (طفولة الصبي في القرية):\n- خيالات الطفولة: ذكريات غامضة كالسياج أمام البيت.\n- كان سابع ثلاثة عشر من أبناء أبيه، وفقد بصره بسبب الرمد وعلاج الحلاق الخاطئ.\n- حفظ القرآن في الكتّاب قبل التاسعة فلُقب بالشيخ، ثم نسيه فذاق مرارة الفشل حين امتحنه أبوه.\n- سهام القدر: موت أخته الصغرى، ثم موت أخيه الشاب بالكوليرا في الثامنة عشرة.\n- الاستعداد للأزهر، وختام الجزء بخطابه لابنته («بين أب وابنته»).','الجزء الثاني (حياة الصبي في الأزهر بالقاهرة):\n- من البيت إلى الأزهر: انتقل مع أخيه، وسكن غرفة في «الربع».\n- حب الصبي للأزهر ووحدته في غرفته: خوفه من الظلمة والأصوات حين يتركه أخوه.\n- الحاج علي: رجل مرح كبير السن يسكن آخر الربع ويجالس شباب الأزهر.\n- الإمام محمد عبده: كان طلاب الأزهر يتحمسون لدرسه.\n- انتساب الصبي للأزهر وفرحته، ثم تغير حياته.\n- تمرد الصبي على جمود بعض الشيوخ وطرق التدريس.\n- إقبال الصبي على الأدب: حضر درس الشيخ سيد المرصفي وسمع ديوان الحماسة، فوجد في الأدب حرية ومتعة.'],
 english:['Present perfect: we use "have / has" with the past participle for experiences and for actions that started in the past and continue now.\nExamples: She has worked here for ten years. Have you ever visited Aswan?\nPresent perfect continuous: "have / has been" with the verb plus ing, which stresses duration.\nExample: I have been studying since morning.\nUse "for" with a period of time and "since" with a point in time. Common words: just, already, yet, ever, never.','Reported statements: move the tense one step back. Present simple becomes past simple, present continuous becomes past continuous, past simple becomes past perfect, and will becomes would.\nChange time and place words: tomorrow becomes the next day, yesterday becomes the day before, here becomes there, and this becomes that.\nReported commands: told someone to do something. Negative commands: told someone not to do something.\nExample: "Close the door," he said. He told me to close the door.','Modal verbs about the past, followed by "have" and the past participle:\nmust have means we are almost certain it happened.\ncan\'t have means it is impossible that it happened.\nmight have or could have means it is possible.\nshould have means regret or advice about the past (it did not happen).\nshouldn\'t have means blame or criticism (it happened but it was wrong).\nneedn\'t have means it happened but was not necessary.\nUnit topic: climate change, pollution and protecting nature.','Adjectives ending in ing describe the thing or situation (an amazing reef). Adjectives ending in ed describe how people feel (the divers were amazed).\nCompound adjectives join two words with a hyphen, for example well-known, brightly-coloured, five-day.\nWith numbers the noun stays singular: a three-star hotel, a ten-minute walk.\nUnit topic: coral reefs, whales, and eco-friendly tourism in the Red Sea.','The causative shows that someone else does a job for us.\nhave plus object plus past participle: I had my car repaired.\nget plus object plus past participle: She got her hair cut.\nhave plus person plus bare infinitive: The manager had his assistant write the report.\nget plus person plus to infinitive: I got my brother to help me.\nUnit topic: technology, AI in the workplace, and a growth mindset.','Reported questions use normal statement word order (subject before verb) and no question mark.\nYes or no questions: asked if or asked whether. Example: "Are you coming?" She asked if I was coming.\nWh questions: keep the question word. Example: "Where do you live?" He asked me where I lived.\nBackshift the tense as in reported statements.\nUnit topic: friendship, invitations, and the benefits of socializing.','Past perfect: "had" with the past participle, for the earlier of two past actions.\nExample: When we arrived, the plane had already taken off.\nPast perfect continuous: "had been" with the verb plus ing, for duration before a past moment.\nExample: He was tired because he had been waiting for hours.\nUnit vocabulary: boarding pass, terminal, departure lounge, security checkpoint. Idioms: in hot water, go with the flow, someone\'s heart sinks.','Passive voice: the object becomes the subject, and we use "be" with the past participle.\nPresent: is built. Past: was built. Present continuous: is being built. Present perfect: has been built. Future: will be built. Modals: must be protected.\nWe add "by" with the doer only when it is important.\nUnit topic: ancient civilizations of Egypt, China and Greece, and the Code of Hammurabi.','Verb patterns:\nVerbs followed by the to infinitive: want, decide, hope, plan, afford, agree, refuse.\nVerbs followed by the ing form (gerund): enjoy, avoid, finish, suggest, mind, keep, and expressions like look forward to.\nVerbs followed by an object and the bare infinitive: make and let.\nUnit topic: black holes and the mysteries of the universe, including the first black hole image in 2019.','Relative clauses give information about a noun.\nwho for people, which for things, whose for possession, where for places, when for times. "that" can replace who or which in defining clauses.\nDefining clauses give essential information and use no commas.\nNon-defining clauses give extra information, use commas, and never use "that".\nWish: I wish I had more time (a wish about the present).\nUnit topic: hospitality and kindness across cultures.','Comparatives compare two things: short adjectives add er (taller), long adjectives use more (more exciting), followed by "than".\nSuperlatives compare three or more: the tallest, the most exciting.\nIrregular forms: good, better, best. bad, worse, worst. far, further, furthest.\nEquality: as tall as. Negative: not as popular as.\nUnit topic: literature, novels, poetry, drama and short stories.','Question tags are short questions at the end of a sentence to check information or ask for agreement.\nPositive sentence, negative tag: You are Egyptian, aren\'t you?\nNegative sentence, positive tag: She isn\'t here, is she?\nRepeat the auxiliary or modal. With no auxiliary use do, does or did.\nSpecial cases: I am, aren\'t I? Let\'s, shall we? Imperatives, will you? Nobody or nothing takes a positive tag.\nUnit topic: university life, choosing a major, scholarships.'],
 chemistry:['العناصر الانتقالية: عناصر الفئة d، يتتابع فيها امتلاء المستوى الفرعي d.\n- السلسلة الأولى (3d) في الدورة الرابعة من السكانديوم إلى الخارصين، والثانية (4d) من اليتريوم إلى الكادميوم.\n- من خواصها: تعدد حالات التأكسد، والألوان، والخواص المغناطيسية، والنشاط الحفزي.\n- البارامغناطيسية سببها الإلكترونات المفردة، ويزيد العزم المغناطيسي بزيادة عددها. Sc³⁺ و Zn²⁺ و Cu⁺ ديامغناطيسية وعديمة اللون.\n- استخدامات: السكانديوم في سبائك طائرات الميج، والتيتانيوم في زراعة الأسنان، و V₂O₅ عامل حفاز، والنيكل في هدرجة الزيوت، والكوبلت-60 في حفظ الأغذية، والخارصين في الجلفنة.\n- الحديد: خاماته الماجنتيت Fe₃O₄ (الأعلى نسبة) والهيماتيت Fe₂O₃ والليمونيت والسيدريت FeCO₃. يُختزل في الفرن العالي بـ CO، وفي فرن مدركس بخليط CO و H₂ الناتج من الغاز الطبيعي.\n- السبائك: بينية، واستبدالية (حديد وكروم)، ومركبات بينفلزية.','التحليل الكيميائي نوعان: وصفي (ما مكونات المادة؟) وكمي (ما كمية كل مكون؟).\n- الأنيونات: مجموعة HCl المخفف (CO₃²⁻ ، HCO₃⁻ ، SO₃²⁻ ، S²⁻ ، NO₂⁻ ، S₂O₃²⁻)، ومجموعة H₂SO₄ المركز (Cl⁻ ، Br⁻ ، I⁻ ، NO₃⁻)، ومجموعة BaCl₂ (SO₄²⁻ ، PO₄³⁻).\n- كشوف مميزة: CO₂ يعكر ماء الجير، SO₂ يخضّر ثاني كرومات البوتاسيوم المحمضة، H₂S يسوّد أسيتات الرصاص، النترات بالحلقة البنية، AgCl أبيض يذوب في النشادر.\n- الكاتيونات: المجموعة الثانية (Cu²⁺) تترسب كبريتيدات، والثالثة (Al³⁺ ، Fe²⁺ ، Fe³⁺) هيدروكسيدات بالنشادر، والخامسة (Ca²⁺) كربونات.\n- التحليل الكمي الحجمي (المعايرة) بالأدلة: الفينولفثالين عديم اللون/أحمر، والميثيل البرتقالي أحمر/أصفر، وأزرق بروموثيمول أصفر/أزرق.\nM₁ V₁ = M₂ V₂\n- التحليل الكمي الكتلي: بالتطاير أو بالترسيب.','التفاعلات تامة وانعكاسية. الاتزان الكيميائي: حالة ديناميكية يتساوى فيها معدلا التفاعلين الطردي والعكسي.\n- العوامل المؤثرة في معدل التفاعل: طبيعة المتفاعلات، والتركيز، والحرارة، والضوء، والعامل الحفاز (يقلل طاقة التنشيط ولا يغير موضع الاتزان).\n- قانون فعل الكتلة وثابت الاتزان، ولا تظهر المواد الصلبة والسائلة النقية في تعبيره. Kc تتغير بالحرارة فقط.\n- قاعدة لوشاتلييه: إذا أثر مؤثر على نظام متزن ينشط في الاتجاه الذي يقلل أثره.\n- الإلكتروليتات قوية وضعيفة. قانون أستفالد:\nα = √(Ka / Ca)\n- الحاصل الأيوني للماء:\nKw = [H⁺][OH⁻] = 10⁻¹⁴\npH + pOH = 14\n- التحلل المائي للأملاح، وحاصل الإذابة Ksp.','الكيمياء الكهربية تدرس تحول الطاقة الكيميائية إلى كهربية (الخلايا الجلفانية) والعكس (الخلايا الإلكتروليتية).\n- خلية دانيال: أنود الخارصين (أكسدة) وكاثود النحاس (اختزال)، والقنطرة الملحية توصل المحلولين وتعادل الشحنات.\nemf = 0.76 + 0.34 = 1.1 V\n- السلسلة الكهروكيميائية: العنصر الأعلى جهد أكسدة أقوى عامل مختزل.\n- الخلايا الأولية: خلية الزئبق (1.35 V)، وخلية الوقود (1.23 V، وتنتج الماء). الثانوية: المركم الرصاصي (2 V للخلية، 12 V للبطارية)، وبطارية أيون الليثيوم.\n- التآكل والحماية: الجلفنة بالخارصين (أنود مضحٍّ)، والقصدير يحمي الحديد ما دام سليماً فقط.\n- قوانين فاراداي: الفاراداي = 96500 كولوم يرسب كتلة مكافئة جرامية.\nQ = I × t\n- التطبيقات: الطلاء الكهربي، وتنقية النحاس، واستخلاص الألومنيوم من البوكسيت مع الكريوليت.','الكيمياء العضوية: كيمياء مركبات الكربون. سقطت نظرية القوة الحيوية بتحضير فوهلر لليوريا.\n- الهيدروكربونات: الألكانات CₙH₂ₙ₊₂ (مشبعة، تفاعلاتها بالاستبدال)، والألكينات CₙH₂ₙ (رابطة ثنائية، تفاعلات إضافة، ماركونيكوف)، والألكاينات CₙH₂ₙ₋₂ (رابطة ثلاثية)، والأروماتية (البنزين C₆H₆).\n- تحضير: الميثان من أسيتات الصوديوم والجير الصودي، والإيثين من الإيثانول و H₂SO₄ المركز عند 180°C، والأسيتيلين من كربيد الكالسيوم والماء، والبنزين من بنزوات الصوديوم والجير الصودي.\n- الكحولات: أولية (تتأكسد لألدهيد ثم حمض)، وثانوية (لكيتون)، وثالثية (لا تتأكسد). الفينول أكثر حمضية ويتفاعل مع NaOH، ومنه البكاليت مع الفورمالدهيد.\n- الأحماض الكربوكسيلية (−COOH) تتفاعل مع NaHCO₃ ويتصاعد CO₂.\n- الإسترات: حمض + كحول ⇌ إستر + ماء. والتصبن: تحلل الدهون في وسط قلوي.'],
 physics:[null,'التأثير المغناطيسي للتيار:\n- كثافة الفيض حول سلك مستقيم:\nB = μ I / (2π d)\n- عند مركز ملف دائري:\nB = μ N I / (2 r)\n- داخل ملف لولبي:\nB = μ N I / L\n- القوة على سلك في مجال:\nF = B I L sin θ\n- عزم الازدواج على ملف:\nτ = B I A N sin θ\n- الجلفانومتر يتحول إلى أميتر بمجزئ تيار صغير على التوازي، وإلى فولتميتر بمضاعف جهد كبير على التوالي. الأوميتر يقيس المقاومة مباشرة.\nR_s = (I_g R_g) / (I − I_g)','الحث الكهرومغناطيسي: تتولد قوة دافعة مستحثة عند تغير الفيض المغناطيسي.\n- قانون فاراداي:\nemf = −N ΔΦ / Δt\n- قاعدة لنز: التيار المستحث يقاوم التغير المسبب له.\n- في سلك مستقيم متحرك (قاعدة اليد اليمنى لفلمنج):\nemf = B L v sin θ\n- الحث المتبادل والحث الذاتي، ووحدة معامل الحث الهنري.\n- المولد الكهربي (الدينامو) يحول الطاقة الميكانيكية إلى كهربية، والمحرك العكس.\n- المحول: يعمل بالتيار المتردد فقط، والقلب من شرائح معزولة لتقليل التيارات الدوامية.\nVs / Vp = Ns / Np','دوائر التيار المتردد:\n- القيمة الفعالة:\nI_eff = 0.707 I_max\n- المفاعلة الحثية تزيد بزيادة التردد، والتيار يتأخر عن الجهد بربع دورة:\nX_L = 2π f L\n- المفاعلة السعوية تقل بزيادة التردد، والتيار يتقدم على الجهد بربع دورة:\nX_C = 1 / (2π f C)\n- المعاوقة في دائرة RLC:\nZ = √(R² + (X_L − X_C)²)\n- الرنين عندما X_L = X_C فتكون المعاوقة أقل ما يمكن (= R) والتيار أكبر ما يمكن:\nf = 1 / (2π √(L C))\n- تستخدم دائرة الرنين في اختيار محطات الراديو.','ازدواجية الموجة والجسيم:\n- إشعاع الجسم الأسود: بارتفاع الحرارة يقل الطول الموجي المقابل لأقصى شدة (قانون فين).\n- الفوتون: كم من الطاقة.\nE = h ν\n- التأثير الكهروضوئي: لا تنبعث إلكترونات إذا كان التردد أقل من الحرج مهما زادت الشدة. زيادة الشدة تزيد عدد الإلكترونات، وزيادة التردد تزيد طاقة حركتها.\nh ν = E_w + KE\n- تأثير كومبتون: الفوتون المشتت يقل تردده ويزداد طوله الموجي.\n- طول موجة دي برولي:\nλ = h / (m v)\n- الميكروسكوب الإلكتروني يعتمد على الطبيعة الموجية للإلكترونات.','الأطياف الذرية:\n- نموذج بور: يدور الإلكترون في مستويات طاقة محددة، وتشع الذرة فوتوناً عند انتقاله من مستوى أعلى لمستوى أقل.\nh ν = E₂ − E₁\n- طاقة مستويات ذرة الهيدروجين:\nE = −13.6 / n² eV\n- متسلسلات طيف الهيدروجين: ليمان (فوق بنفسجية، n = 1)، وبالمر (مرئية، n = 2)، وباشن (تحت حمراء، n = 3).\n- الأشعة السينية: طيف مستمر من تباطؤ الإلكترونات عند الهدف، وطيف خطي مميز يعتمد على مادة الهدف.','الليزر: تضخيم الضوء بالانبعاث المستحث للإشعاع.\n- الانبعاث المستحث: فوتون يحفز ذرة مثارة فتطلق فوتوناً مماثلاً له في التردد والطور والاتجاه.\n- الإسكان المعكوس: عدد الذرات المثارة أكبر من عدد الذرات في المستوى الأرضي، وهو شرط الفعل الليزري، وتساعد عليه الحالة شبه المستقرة.\n- مكونات الجهاز: المادة الفعالة، ومصدر الطاقة (الضخ)، والتجويف الرنيني (مرآتان إحداهما نصف عاكسة).\n- ليزر He-Ne: نسبة الهيليوم للنيون 10 : 1، والشعاع يصدر من ذرات النيون.\n- خصائصه: أحادي الطول الموجي، ومترابط، ومتوازٍ، وعالي الشدة. ومن استخداماته جراحات العيون والاتصالات والهولوجرام.','الإلكترونيات الحديثة:\n- أشباه الموصلات (السيليكون والجرمانيوم): في البلورة النقية عدد الإلكترونات الحرة = عدد الفجوات.\n- التطعيم: بعنصر خماسي التكافؤ (الفوسفور) ينتج بلورة سالبة n-type، وبعنصر ثلاثي (البورون) ينتج بلورة موجبة p-type.\n- الدايود (الوصلة الثنائية): يوصل في الاتجاه الأمامي فقط، فيستخدم موحداً للتيار.\n- الترانزستور: باعث وقاعدة ومجمع.\nI_E = I_B + I_C\nβ = I_C / I_B\nα = I_C / I_E\n- البوابات المنطقية: AND (الخرج 1 إذا كان الدخلان 1)، OR (الخرج 1 إذا كان أحد الدخلين 1)، NOT (تعكس الدخل).'],
 biology:['الدعامة في النبات: الامتلاء في النباتات العشبية، والأنسجة الدعامية (الكولنشيمية والإسكلرنشيمية)، وتغلظ الخشب باللجنين.\n- الهيكل العظمي للإنسان: محوري (الجمجمة، والعمود الفقري 33 فقرة، والقفص الصدري 12 زوجاً من الضلوع والقص) وطرفي (الأطراف والأحزمة).\n- المفاصل: ليفية غير متحركة (عظام الجمجمة)، وغضروفية محدودة الحركة (الفقرات)، وزلالية متحركة (كروية: الكتف والفخذ، ورزية: المرفق والركبة).\n- العضلات الهيكلية: الليفة العضلية تحتوي ساركوميرات من خيوط الأكتين الرفيعة والميوسين السميكة. نظرية الخيوط المنزلقة: ينزلق الأكتين على الميوسين باستخدام ATP وأيونات الكالسيوم.\n- إجهاد العضلة: تراكم حمض اللاكتيك عند التنفس اللاهوائي.\n- الحركة في النبات: الانتحاءات (الضوئي بسبب الأوكسين) والحركات الموضعية.','الغدد الصماء تفرز الهرمونات في الدم مباشرة.\n- النخامية (سيدة الغدد): الفص الأمامي يفرز هرمون النمو والهرمونات المنشطة (FSH ، LH ، TSH ، ACTH) والبرولاكتين. والفص الخلفي يخزن ويفرز ADH والأوكسيتوسين اللذين يصنعهما الهيبوثلامس.\n- الدرقية: الثيروكسين (نقص اليود يسبب الجويتر)، والكالسيتونين يخفض الكالسيوم. جارات الدرقية: الباراثورمون يرفع الكالسيوم.\n- البنكرياس (جزر لانجرهانز): الأنسولين من خلايا بيتا يخفض السكر، والجلوكاجون من خلايا ألفا يرفعه.\n- الكظرية: القشرة (الألدوستيرون والكورتيزون) والنخاع (الأدرينالين والنورأدرينالين).\n- هرمونات النبات: الأوكسينات (الاستطالة)، والجبريلينات، والسيتوكينينات (الانقسام)، وحمض الأبسيسيك (السكون)، والإيثيلين (النضج).','التكاثر اللاجنسي: الانشطار الثنائي (البكتيريا والأميبا)، والتبرعم (الخميرة والهيدرا)، والتجدد (البلاناريا ونجم البحر)، والتكاثر بالجراثيم، والتوالد البكري (ذكور النحل أحادية المجموعة الصبغية)، والتكاثر الخضري وزراعة الأنسجة.\n- تبادل الأجيال: جيل جرثومي (2n) وجيل مشيجي (n) كما في السرخس.\n- النبات الزهري: الإخصاب المزدوج؛ نواة ذكرية + البويضة = الزيجوت (2n)، ونواة ذكرية + النواتان القطبيتان = الإندوسبرم (3n).\n- الجهاز التناسلي الذكري: الخصية (الأنابيب المنوية والخلايا البينية التي تفرز التستوستيرون)، والبربخ لتخزين الحيوانات المنوية.\n- الدورة الشهرية: FSH ينضج حويصلة جراف، و LH يسبب التبويض ويكون الجسم الأصفر الذي يفرز البروجسترون.\n- التوائم المتماثلة من بويضة واحدة مخصبة، والمتآخية من بويضتين.','المناعة: قدرة الجسم على مقاومة مسببات الأمراض.\n- مناعة طبيعية غير متخصصة: الجلد، والمخاط، والليسوزيم في الدموع، والبلعمة، والالتهاب، والإنترفيرون.\n- مناعة مكتسبة متخصصة: خلطية بالخلايا البائية التي تتحول لخلايا بلازمية تفرز الأجسام المضادة، وخلوية بالخلايا التائية (المساعدة، والقاتلة، والمثبطة).\n- تنضج الخلايا البائية في نخاع العظم، والتائية في الغدة التيموسية.\n- الجسم المضاد على شكل Y من أربع سلاسل: سلسلتان ثقيلتان وسلسلتان خفيفتان.\n- خلايا الذاكرة تسرع الاستجابة الثانوية.\n- اللقاح: مناعة مكتسبة إيجابية. المصل: مناعة مكتسبة سلبية.\n- فيروس HIV يهاجم الخلايا التائية المساعدة.','الحمض النووي DNA هو المادة الوراثية:\n- جريفث (1928): التحول البكتيري في بكتيريا الالتهاب الرئوي.\n- أفري وزملاؤه: DNA هو العامل المحول.\n- هيرشي وتشيس: البكتيريوفاج، بالفوسفور المشع لـ DNA والكبريت المشع للبروتين.\n- واطسون وكريك (1953): الحلزون المزدوج.\n- النيوكليوتيدة: سكر ديؤكسي ريبوز + فوسفات + قاعدة نيتروجينية. البيورينات: الأدينين والجوانين. البيريميدينات: الثايمين والسيتوزين.\n- قاعدة شارجاف: A = T و G = C.\n- التضاعف شبه محافظ: الهيليكيز يفتح الشريطين، و DNA بوليميريز يبني الشريط الجديد، والليجيز يربط القطع.','تخليق البروتين:\n- النسخ: يكوّن RNA بوليميريز جزيء mRNA مكملاً لأحد شريطي DNA داخل النواة (اليوراسيل بدل الثايمين).\n- الترجمة: عند الريبوسوم يُقرأ mRNA في كودونات (ثلاث قواعد)، وينقل tRNA الحمض الأميني المناسب حسب الشفرة المضادة.\n- الشفرة الوراثية: 64 كودوناً؛ AUG كودون البدء (ميثيونين)، و UAA و UAG و UGA كودونات التوقف.\n- الطفرات: تغير في تتابع القواعد.\n- الهندسة الوراثية: إنزيمات القطع تقطع DNA عند تتابعات محددة، والبلازميد ناقل، والليجيز يلحم الجين. ومن تطبيقاتها إنتاج الأنسولين البشري بالبكتيريا.','علوم الأرض:\n- المعدن: مادة صلبة طبيعية غير عضوية لها تركيب كيميائي وبناء بلوري محدد. من خواصه الصلادة (مقياس موس: التلك 1، الجبس 2، الكالسيت 3، الفلوريت 4، الأباتيت 5، الأورثوكليز 6، الكوارتز 7، التوباز 8، الكوراندوم 9، الماس 10) والانفصام واللون والبريق.\n- الصخور: نارية (جوفية خشنة الحبيبات كالجرانيت، وبركانية دقيقة كالبازلت)، ورسوبية (تحتوي الحفريات كالحجر الجيري والرملي)، ومتحولة (الرخام من الجيري، والكوارتزيت من الرملي، والأردواز من الطفلة).\n- دورة الصخور: تحول الصخور من نوع لآخر بالتجوية والترسيب والحرارة والضغط والانصهار.\n- التراكيب الجيولوجية: الطيات (المحدبة والمقعرة)، والفوالق (كسر مع إزاحة)، وعدم التوافق، والقواطع (تقطع الطبقات) والجدد (توازي الطبقات).'],
 puremath:['نظرية ذات الحدين لأس صحيح موجب:\n- عدد حدود مفكوك (x + a)ⁿ يساوي n + 1، ومجموع المعاملات نحصل عليه بالتعويض x = a = 1.\n- الحد العام:\nT(r+1) = nCr × xⁿ⁻ʳ × aʳ\n- الحد الأوسط: إذا كان n زوجياً يوجد حد أوسط واحد رتبته n/2 + 1، وإذا كان فردياً يوجد حدان أوسطان.\n- الحد الخالي من x: نجعل أس x في الحد العام صفراً ونحسب r.\n- النسبة بين حدين متتاليين:\n(T(r+1)) / (T(r)) = (n − r + 1) / r × a / x','الأعداد المركبة:\ni² = −1\n- الصورة الجبرية z = x + y i ، والمقياس:\n|z| = √(x² + y²)\n- السعة θ تحدد من tan θ = y / x مع مراعاة الربع.\n- الصورة المثلثية:\nz = r (cos θ + i sin θ)\n- نظرية ديموافر:\n(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ\n- الجذور التكعيبية للواحد الصحيح: 1 و ω و ω² حيث:\n1 + ω + ω² = 0\nω³ = 1','الهندسة في الفراغ:\n- نظام الإحداثيات المتعامد في ثلاثة أبعاد (x ، y ، z).\n- المسافة بين نقطتين:\nd = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²)\n- المتجه A = (a₁ ، a₂ ، a₃) ومعياره √(a₁² + a₂² + a₃²)، ومتجه الوحدة = المتجه ÷ معياره.\n- الضرب القياسي (عدد):\nA · B = |A| |B| cos θ\n- يتعامد المتجهان إذا كان A · B = 0.\n- الضرب الاتجاهي (متجه عمودي عليهما):\n|A × B| = |A| |B| sin θ\n- معيار الضرب الاتجاهي يساوي مساحة متوازي الأضلاع المرسوم على المتجهين، ويتوازى المتجهان إذا كان A × B = 0.','المستقيمات والمستويات في الفراغ:\n- المعادلة الاتجاهية للمستقيم المار بالنقطة A في اتجاه d:\nr = A + t d\n- معادلة المستوى العامة، والمتجه (a ، b ، c) عمودي عليه:\na x + b y + c z + d = 0\n- يتوازى مستويان إذا توازى متجها العمودي عليهما، ويتعامدان إذا كان حاصل ضربهما القياسي صفراً.\n- طول العمود من النقطة (x₁ ، y₁ ، z₁) على المستوى:\nL = (|a x₁ + b y₁ + c z₁ + d|) / (√(a² + b² + c²))','التفاضل وتطبيقاته:\n- قاعدة السلسلة: مشتقة الدالة المركبة = مشتقة الخارجية × مشتقة الداخلية.\n- الاشتقاق الضمني: نشتق الطرفين بالنسبة لـ x ونعتبر y دالة في x.\n- المعادلات البارامترية:\ndy/dx = (dy/dt) / (dx/dt)\n- المشتقات العليا: المشتقة الثانية y″ هي مشتقة y′.\n- مشتقات الدوال الأسية واللوغاريتمية:\nd/dx (eˣ) = eˣ\nd/dx (ln x) = 1 / x\nd/dx (aˣ) = aˣ ln a\n- ميل المماس عند نقطة = قيمة المشتقة الأولى عندها.','سلوك الدالة ورسم المنحنيات:\n- إذا كانت f′(x) > 0 على فترة فالدالة تزايدية، وإذا كانت f′(x) < 0 فهي تناقصية.\n- النقط الحرجة: حيث f′(x) = 0 أو غير معرفة.\n- اختبار المشتقة الثانية: إذا كانت f′(a) = 0 و f″(a) < 0 فعند a قيمة عظمى محلية، وإذا كانت f″(a) > 0 فقيمة صغرى محلية.\n- التحدب: f″ > 0 المنحنى محدب لأسفل، و f″ < 0 محدب لأعلى.\n- نقطة الانقلاب: f″ = 0 وتتغير إشارتها.\n- تطبيقات القيم العظمى والصغرى: نكتب الكمية المطلوبة كدالة في متغير واحد، ثم نشتق ونساوي بالصفر.','التكامل المحدد وتطبيقاته:\n- التكامل بالتعويض، والتكامل بالتجزيء:\n∫ u dv = u v − ∫ v du\n- التكامل المحدد = قيمة الدالة الأصلية عند الحد الأعلى − قيمتها عند الحد الأدنى.\n- المساحة المحصورة بين المنحنى ومحور x من a إلى b:\nA = ∫ y dx\n- المساحة بين منحنيين = تكامل (الأعلى − الأسفل).\n- حجم الجسم الناشئ من دوران منطقة حول محور x:\nV = π ∫ y² dx'],
 appliedmath:['العزوم:\n- عزم القوة حول نقطة يقيس قدرتها على إحداث الدوران، وهو متجه:\nM = r × F\n- في المستوى: مقدار العزم = القوة × البعد العمودي بين النقطة وخط عمل القوة، وفي الإحداثيات:\nM = x Fy − y Fx\n- العزم موجب إذا كان الدوران عكس عقارب الساعة، وسالب في اتجاهها.\n- يكون العزم صفراً إذا مر خط عمل القوة بالنقطة.\n- نظرية العزوم: عزم المحصلة حول نقطة = مجموع عزوم القوى حول النقطة نفسها.\n- الوحدة: نيوتن.متر أو داين.سم.','القوى المستوية:\n- محصلة قوتين متوازيتين في اتجاه واحد = مجموعهما، وتقع بينهما أقرب للقوة الأكبر.\n- محصلة قوتين متوازيتين متضادتين = الفرق بينهما، وتقع خارجهما من جهة القوة الأكبر.\n- موضع المحصلة من تساوي العزوم:\nF₁ × d₁ = F₂ × d₂\n- اتزان جسم متماسك تحت تأثير قوى مستوية: المحصلة = صفر، ومجموع العزوم حول أي نقطة = صفر.\n- رد فعل المستوى الأملس عمودي عليه، وعلى المستوى الخشن يميل بزاوية الاحتكاك.','الازدواجات:\n- الازدواج: قوتان متساويتان مقداراً ومتضادتان اتجاهاً وخطا عملهما متوازيان، ومحصلتهما صفر.\n- عزم الازدواج = إحدى القوتين × البعد العمودي بينهما (ذراع الازدواج)، وهو ثابت حول أي نقطة في مستواه.\nM = F × d\n- يتكافأ ازدواجان إذا تساوى عزماهما.\n- الازدواج المحصل لعدة ازدواجات مستوية عزمه = المجموع الجبري لعزومها.\n- لا يتزن الازدواج إلا مع ازدواج آخر مساوٍ له في العزم ومضاد في الاتجاه.\n- إذا كانت محصلة القوى صفراً ومجموع عزومها لا يساوي صفراً فإنها تكافئ ازدواجاً.','الحركة في خط مستقيم (تفاضل وتكامل الدوال المتجهة):\n- السرعة = مشتقة الإزاحة بالنسبة للزمن، والعجلة = مشتقة السرعة:\nv = dr/dt\na = dv/dt\n- بدلالة الإزاحة:\na = v dv/ds\n- نحصل على السرعة بتكامل العجلة، وعلى الإزاحة بتكامل السرعة، ونستخدم الشروط الابتدائية لتعيين الثوابت.\n- إذا كانت العجلة ثابتة:\nv = v₀ + a t\ns = v₀ t + ½ a t²\nv² = v₀² + 2 a s','تطبيقات على قوانين نيوتن:\n- القانون الثاني: القوة = معدل تغير كمية الحركة:\nF = d(m v)/dt\n- للأجسام ثابتة الكتلة F = m a ، وللأجسام متغيرة الكتلة نستخدم الصورة العامة.\n- الأجسام المتصلة بخيط على بكرة ملساء:\na = (m₁ − m₂) g / (m₁ + m₂)\nT = 2 m₁ m₂ g / (m₁ + m₂)\n- الدفع = القوة × زمن تأثيرها = التغير في كمية الحركة:\nI = F t = m v₂ − m v₁\n- الوحدات: 1 نيوتن = 10⁵ داين، وكمية الحركة بالكجم.م/ث.','الشغل والطاقة والقدرة:\n- الشغل = القوة × الإزاحة في اتجاهها، ويكون صفراً إذا كانت القوة عمودية على الحركة:\nW = F s cos θ\n- طاقة الحركة وطاقة الوضع:\nKE = ½ m v²\nPE = m g h\n- نظرية الشغل والطاقة: الشغل المبذول = التغير في طاقة الحركة.\n- مبدأ بقاء الطاقة الميكانيكية في غياب المقاومات.\n- القدرة = معدل بذل الشغل، وتقاس بالوات:\nP = W / t = F v\n- 1 جول = 10⁷ إرج، و 1 كيلووات ساعة = 3.6 × 10⁶ جول.'],
 history:['الحملة الفرنسية (1798–1801م):\n- أسبابها: ضرب تجارة إنجلترا وقطع طريقها إلى الهند، وإقامة مستعمرة فرنسية، وحلم نابليون بإمبراطورية في الشرق.\n- نزلت الحملة بالإسكندرية، وانتصرت في شبراخيت وإمبابة، ثم دمر نلسون الأسطول الفرنسي في أبي قير البحرية (أغسطس 1798م).\n- المقاومة: ثورة القاهرة الأولى (1798م) بقيادة رجال الأزهر، وثورة القاهرة الثانية (1800م)، واغتيال كليبر على يد سليمان الحلبي.\n- فشلت الحملة على الشام عند أسوار عكا (1799م).\n- خرجت الحملة 1801م في عهد مينو.\n- نتائجها العلمية: المجمع العلمي، وكتاب «وصف مصر»، واكتشاف حجر رشيد الذي فك رموزه شامبليون.','بناء الدولة الحديثة:\n- تولى محمد علي الحكم 1805م باختيار الزعماء الشعبيين بقيادة عمر مكرم.\n- هزم حملة فريزر في رشيد (1807م)، وتخلص من المماليك في مذبحة القلعة (1811م).\n- أقام جيشاً حديثاً ومدارس وبعثات (رفاعة الطهطاوي)، ومطبعة بولاق (1820م)، ونهضة زراعية وصناعية.\n- تسوية لندن 1840م: الحكم وراثي في أسرته، وتقليص الجيش إلى 18 ألفاً.\n- الخديوي إسماعيل: مجلس شورى النواب (1866م)، ولقب الخديوي (1867م)، وافتتاح قناة السويس (1869م)، ثم أزمة الديون والتدخل الأجنبي.','من الثورة العرابية حتى الحرب العالمية الأولى:\n- الثورة العرابية: مظاهرة عابدين (9 سبتمبر 1881م) ومطالب أحمد عرابي، ثم الهزيمة في التل الكبير والاحتلال البريطاني (1882م).\n- الحركة الوطنية: مصطفى كامل وتأسيس الحزب الوطني (1907م)، وحادثة دنشواي (1906م) التي قوّت الحركة الوطنية، ثم محمد فريد.\n- الحرب العالمية الأولى: إعلان الحماية البريطانية على مصر (1914م) وعزل الخديوي عباس حلمي الثاني.','مصر بعد الحرب العالمية الأولى:\n- ثورة 1919م بعد نفي سعد زغلول ورفاقه إلى مالطة، ومقاطعة لجنة ملنر.\n- تصريح 28 فبراير 1922م: استقلال مشروط بتحفظات أربعة، ثم دستور 1923م.\n- معاهدة 1936م مع بريطانيا، وألغتها مصر 1951م.\n- ثورة 23 يوليو 1952م بقيادة الضباط الأحرار، وإعلان الجمهورية، واتفاقية الجلاء 1954م ثم الجلاء 1956م.','التوسع الاستعماري في المغرب العربي حتى الاستقلال:\n- الجزائر: احتلتها فرنسا 1830م، وقاوم الأمير عبد القادر، ثم ثورة التحرير 1954م والاستقلال 1962م.\n- تونس: الحماية الفرنسية بمعاهدة باردو 1881م، والاستقلال 1956م.\n- المغرب: الحماية الفرنسية بمعاهدة فاس 1912م، وثورة الريف بقيادة الخطابي، والاستقلال 1956م.\n- ليبيا: احتلتها إيطاليا 1911م، وقاد عمر المختار المقاومة حتى إعدامه 1931م، والاستقلال 1951م.','البلاد العربية في المشرق بعد الحرب العالمية الأولى:\n- اتفاقية سايكس بيكو (1916م) قسمت المشرق بين بريطانيا وفرنسا.\n- وعد بلفور (1917م) بإنشاء وطن قومي لليهود في فلسطين.\n- نظام الانتداب (مؤتمر سان ريمو 1920م): بريطانيا على العراق وفلسطين والأردن، وفرنسا على سوريا ولبنان.\n- المقاومة: ثورة العشرين في العراق، والثورة الفلسطينية الكبرى 1936م.\n- الاستقلال: العراق 1932م، وسوريا ولبنان (الجلاء 1946م).','مصر وقضايا العالم العربي المعاصر:\n- جامعة الدول العربية: تأسست في القاهرة 1945م.\n- القضية الفلسطينية: حرب 1948م، ثم العدوان الثلاثي على مصر (بريطانيا وفرنسا وإسرائيل) 1956م بعد تأميم القناة.\n- نكسة 1967م، ثم حرب الاستنزاف (1967–1970م).\n- نصر أكتوبر 1973م وعبور القناة وتحطيم خط بارليف.\n- اتفاقيتا كامب ديفيد 1978م، ومعاهدة السلام 1979م، واسترداد طابا بالتحكيم الدولي 1989م.','ثورتا 25 يناير 2011م و30 يونيو 2013م:\n- ثورة 25 يناير: رفعت شعار «عيش، حرية، عدالة اجتماعية»، وتخلى الرئيس مبارك عن الحكم في 11 فبراير 2011م.\n- ثورة 30 يونيو 2013م: خرجت جموع الشعب، وأُعلنت خارطة المستقبل في 3 يوليو 2013م.\n- دستور 2014م، وانتخاب الرئيس عبد الفتاح السيسي 2014م، والمشروعات القومية مثل قناة السويس الجديدة (2015م).'],
 geography:['مدخل لدراسة الجغرافيا السياسية: تدرس الدولة كوحدة سياسية وعلاقتها بالبيئة الطبيعية والبشرية.\n- عناصر الدولة: الأرض، والشعب، والحكومة، والسيادة.\n- من أهم النظريات: النظرية العضوية لراتزل (الدولة كائن حي ينمو)، ونظرية قلب الأرض لماكيندر، ونظرية قوة البحر لماهان، ونظرية الإطار لسبيكمان.\n- ومن العلماء العرب الذين ربطوا البيئة بقوة الدولة ابن خلدون.','الدولة في الجغرافيا السياسية:\n- المقومات الطبيعية: الموقع (بحري، قاري، حبيس)، والمساحة، والشكل (مندمج، مستطيل، مجزأ، ممتد)، والمناخ، والموارد.\n- أمثلة: تشيلي مستطيلة، وإندونيسيا واليابان مجزأة، وإثيوبيا حبيسة.\n- المقومات البشرية: عدد السكان وتركيبهم، والنشاط الاقتصادي، ومستوى التعليم والتقدم.\n- النظام السياسي والانتخابي: السلطات التشريعية والتنفيذية والقضائية، والتداول السلمي للسلطة.','المشكلات السياسية:\n- الحدود السياسية: خطوط تفصل بين سيادة الدول. أنواعها: طبيعية (جبال وأنهار)، وهندسية فلكية (مثل خط عرض 22° شمالاً بين مصر والسودان)، وبشرية.\n- وظائفها: دفاعية، واقتصادية، وقانونية، وتنظيم الحركة.\n- الحدود البحرية: المياه الإقليمية 12 ميلاً بحرياً، والمنطقة المتاخمة 24 ميلاً، والمنطقة الاقتصادية الخالصة 200 ميل.\n- تطور خريطة العالم السياسية ومشكلاتها: نزاعات الحدود.\n- مشكلات اقتصادية ذات بعد سياسي: المياه والأنهار الدولية والموارد.\n- مشكلات اجتماعية ذات بعد سياسي: اللاجئون والهجرة غير الشرعية.','التكتلات الاقتصادية والأحلاف العسكرية:\n- التكتل الاقتصادي: اتفاق دول على إزالة الحواجز الجمركية وتنسيق سياساتها لتحقيق التكامل.\n- أمثلة: الاتحاد الأوروبي (ماستريخت 1992م، اليورو)، والكوميسا (شرق وجنوب أفريقيا، ومصر عضو)، والآسيان (جنوب شرق آسيا)، والميركوسور (أمريكا الجنوبية)، والبريكس (انضمت مصر 2024م).\n- الأحلاف العسكرية: للدفاع المشترك. حلف الناتو (1949م) بزعامة الولايات المتحدة، وحلف وارسو (1955م) بزعامة الاتحاد السوفيتي وانتهى 1991م.','العلاقات الدولية والنظام الدولي الجديد:\n- العلاقات الدولية تتراوح بين التعاون والتنافس والصراع.\n- الأمم المتحدة (1945م، مقرها نيويورك)، ومجلس الأمن 15 عضواً منهم 5 دائمون لهم حق الفيتو: الولايات المتحدة وروسيا والصين وبريطانيا وفرنسا.\n- الحرب الباردة بين المعسكرين، ثم القطب الواحد بعد تفكك الاتحاد السوفيتي 1991م، ثم صعود قوى جديدة كالصين نحو تعدد الأقطاب.\n- العولمة: الشركات متعددة الجنسيات، وثورة الاتصالات، وحرية التجارة.'],
 statistics:['الارتباط والانحدار:\n- الارتباط يقيس قوة واتجاه العلاقة الخطية بين متغيرين، وقيمته بين −1 و 1. الموجب طردي والسالب عكسي، والصفر يعني انعدام الارتباط الخطي. الارتباط لا يدل على السببية.\n- معامل ارتباط بيرسون للبيانات الكمية، ومعامل ارتباط الرتب لسبيرمان:\nr = 1 − 6 Σd² / (n (n² − 1))\n- خط الانحدار يستخدم للتنبؤ بقيمة المتغير التابع:\nŷ = a + b x\n- ميل خط الانحدار له إشارة معامل الارتباط نفسها.','مقاييس متقدمة في الإحصاء:\n- الساق والأوراق: الساق رقم العشرات والورقة رقم الآحاد، وتعرض شكل التوزيع مع الاحتفاظ بالقيم.\n- الربيعات: Q₁ يقل عنه 25% من البيانات، و Q₂ هو الوسيط، و Q₃ يقل عنه 75%.\n- مخطط الصندوق: يعرض القيمة الصغرى و Q₁ والوسيط و Q₃ والقيمة العظمى.\n- نصف المدى الربيعي مقياس تشتت لا يتأثر بالقيم المتطرفة:\n(Q₃ − Q₁) / 2','الاحتمال:\n- احتمال الحدث بين 0 و 1، والحدث المؤكد احتماله 1، والمستحيل 0.\nP(A′) = 1 − P(A)\nP(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n- الحدثان المتنافيان لا يقعان معاً: P(A ∩ B) = 0.\n- الاحتمال الشرطي:\nP(A | B) = (P(A ∩ B)) / (P(B))\n- الحدثان المستقلان:\nP(A ∩ B) = P(A) × P(B)','المتغيرات العشوائية:\n- المتغير المتقطع يأخذ قيماً منفصلة، ودالة توزيعه f(x) ≥ 0 ومجموع احتمالاتها 1.\nμ = Σ x f(x)\nσ² = Σ x² f(x) − μ²\n- توزيع ذي الحدين (n محاولة مستقلة، واحتمال النجاح p):\nμ = n p\nσ² = n p q\n- التوزيع الهندسي (عدد المحاولات حتى أول نجاح) توقعه 1 ÷ p.\n- المتغير المتصل له دالة كثافة احتمال، والمساحة الكلية تحت منحناها = 1، والاحتمال = مساحة تحت المنحنى.','التوزيع الطبيعي:\n- منحنى جرسي متماثل حول الوسط μ، والوسط = الوسيط = المنوال.\n- التوزيع الطبيعي المعياري وسطه 0 وانحرافه المعياري 1، ونحول إليه بالقيمة المعيارية:\nZ = (X − μ) / σ\n- نستخدم جدول التوزيع الطبيعي المعياري، و P(Z < 0) = 0.5.\n- حوالي 68% من القيم تقع على بعد انحراف معياري واحد من الوسط.\n- فترة الثقة 95% للوسط:\nx̄ ± 1.96 × σ / (√n)\n- كلما زاد حجم العينة قل طول فترة الثقة.']
};
