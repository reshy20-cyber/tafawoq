 arabic:[{ch:4,q:'أعرب ما تحته خط: «يُكرَمُ (المتفوقُ)».',a:'المتفوقُ: نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة، لأن الفعل مبني للمجهول.'},{ch:5,q:'أعرب: «عاد الجنديُّ (منتصراً)»، ثم حوّل الحال إلى جملة.',a:'منتصراً: حال منصوبة وعلامة نصبها الفتحة. وبالجملة: عاد الجنديُّ وهو منتصرٌ (أو: يَنتصر).'},{ch:7,q:'هات مثالاً لبدل اشتمال، وبيّن الرابط فيه.',a:'أعجبني القمرُ ضوؤُه. «ضوؤه» بدل اشتمال مرفوع، والرابط الضمير (الهاء) العائد على المبدل منه.'},{ch:8,q:'تعجّب من جمال النيل بصيغتين قياسيتين.',a:'ما أجملَ النيلَ! / أجمِلْ بالنيلِ!'},{ch:9,q:'بيّن محل الجملة التي تحتها خط: «رأيتُ طفلاً (يبكي)».',a:'جملة «يبكي» في محل نصب نعت لـ «طفلاً»، لأنها جاءت بعد نكرة.'},{ch:10,q:'هات اسم الفاعل واسم المفعول من الفعل «استخدم».',a:'اسم الفاعل: مُستخدِم. اسم المفعول: مُستخدَم.'},{ch:11,q:'بيّن نوع الهمزة في: «إنّ الاستقامةَ أساسُ النجاح» مع التعليل.',a:'همزة «إنّ» همزة قطع لأنها حرف. وهمزة «الاستقامة» همزة وصل (همزة «أل» وهمزة مصدر الفعل السداسي «استقام»).'},{ch:13,q:'«الإرادة هي نفسها العمل الذي يحقق الهدف». وضّح رأي الكاتب في العلاقة بين الإرادة والفعل.',a:'يرى زكي نجيب محمود أنه لا إرادة بغير فعل، فالإرادة والفعل متلازمان كالوالد والولد، وكل فعل يتضمن تغييراً، فإرادة التغيير هي إرادة العمل.'},{ch:14,q:'وازن بين مدرسة الإحياء ومدرسة الديوان من حيث المفهوم والوحدة الفنية.',a:'الإحياء: احتذت القدماء، واهتمت بالأغراض التقليدية، والقصيدة عندها وحدة البيت. الديوان: الشعر وجدان، ودعت إلى الوحدة العضوية والتجديد في المضمون، ونقدت شعر شوقي وحافظ.'},{ch:14,q:'ما سمات شعر المهجر؟',a:'النزعة الإنسانية والتأمل، والحنين إلى الوطن، والتحرر في الأوزان والقوافي، وسهولة اللغة، والاتجاه الروحي والوجداني.'},{ch:15,q:'ما الفرق بين القصة القصيرة والرواية؟',a:'القصة القصيرة تقوم على حدث أو موقف واحد وشخصيات قليلة ووحدة الانطباع، أما الرواية فطويلة تتعدد فيها الأحداث والشخصيات والأزمنة والأماكن.'},{ch:16,q:'عرّف الوحدة العضوية، ووضّح أهم ركائزها.',a:'أن تكون القصيدة بنية حية متماسكة الأجزاء. ركائزها: وحدة الموضوع، ووحدة الجو النفسي، وترتيب الأفكار بحيث لا يمكن تقديم بيت أو تأخيره.'},{ch:17,q:'كيف فقد الصبي بصره؟ وعلامَ يدل ذلك؟',a:'أصيب بالرمد فأُهمل أياماً، ثم عالجه الحلاق علاجاً ذهب بعينيه. ويدل على انتشار الجهل والاعتماد على الحلاقين بدل الأطباء في الريف.'},{ch:18,q:'صف حياة الصبي في «الربع» بالقاهرة.',a:'كان يسكن مع أخيه غرفة في الربع قريبة من الأزهر، يشعر بالوحدة والخوف من الظلمة والأصوات حين يتركه أخوه، ويستمتع بأحاديث الحاج علي وشباب الأزهر.'}],
 english:[{ch:0,q:'Write a sentence using the present perfect continuous to describe something you have been doing this year.',a:'Example: I have been studying English for three hours every day this year.'},{ch:1,q:'Report this command: "Don\'t use your phone in class," the teacher said to us.',a:'The teacher told us not to use our phones in class.'},{ch:2,q:'Write a sentence of regret about the environment using "should have".',a:'Example: We should have recycled our plastic instead of throwing it away.'},{ch:4,q:'Rewrite using the causative: "A painter painted our house last month."',a:'We had our house painted last month.'},{ch:5,q:'Report this question: "What time does the film start?" she asked me.',a:'She asked me what time the film started.'},{ch:6,q:'Join using the past perfect: The plane took off. Then we arrived at the gate.',a:'When we arrived at the gate, the plane had already taken off.'},{ch:7,q:'Change into the passive: "Scientists will discover new planets."',a:'New planets will be discovered by scientists.'},{ch:9,q:'Join using a relative pronoun: I met a woman. Her son is a famous doctor.',a:'I met a woman whose son is a famous doctor.'},{ch:10,q:'Write a paragraph of about 60 words comparing reading novels with watching films, using comparatives.',a:'A model answer compares the two with forms like "more imaginative than", "less tiring than", "as enjoyable as", and gives a clear opinion with reasons.'},{ch:11,q:'Add question tags: 1) You can drive, ... ? 2) He didn\'t call, ... ?',a:'1) can\'t you? 2) did he?'}],
 biology:[{ch:0,q:'اشرح نظرية الخيوط المنزلقة في الانقباض العضلي.',a:'عند وصول السيال العصبي تتحرر أيونات الكالسيوم، فترتبط رؤوس الميوسين بخيوط الأكتين وتسحبها نحو مركز الساركومير باستخدام طاقة ATP، فيقصر الساركومير وتنقبض العضلة دون تغير طول الخيوط نفسها.'},{ch:1,q:'وضّح كيف ينظم البنكرياس مستوى السكر في الدم.',a:'عند ارتفاع السكر تفرز خلايا بيتا الأنسولين فيحول الجلوكوز إلى جليكوجين في الكبد ويزيد امتصاص الخلايا له. وعند انخفاضه تفرز خلايا ألفا الجلوكاجون فيحول الجليكوجين إلى جلوكوز.'},{ch:2,q:'اشرح الإخصاب المزدوج في النباتات الزهرية.',a:'تنتقل نواتان ذكريتان عبر أنبوبة اللقاح: الأولى تندمج مع البويضة لتكوين الزيجوت (2n) الذي ينمو جنيناً، والثانية تندمج مع النواتين القطبيتين لتكوين نواة الإندوسبرم (3n) الذي يغذي الجنين.'},{ch:3,q:'قارن بين المناعة الخلطية والمناعة الخلوية.',a:'الخلطية: تقوم بها الخلايا البائية التي تتحول لخلايا بلازمية تفرز أجساماً مضادة في سوائل الجسم. الخلوية: تقوم بها الخلايا التائية التي تهاجم الخلايا المصابة مباشرة وتنظم الاستجابة.'},{ch:4,q:'اشرح تجربة هيرشي وتشيس ونتيجتها.',a:'رقّما البكتيريوفاج بالفوسفور المشع (في DNA) والكبريت المشع (في البروتين)، فوجدا أن الفوسفور المشع فقط دخل البكتيريا ونتجت فيروسات جديدة، فاستنتجا أن DNA هو المادة الوراثية.'},{ch:5,q:'اشرح خطوات تخليق البروتين.',a:'النسخ: يكوّن RNA بوليميريز جزيء mRNA من DNA في النواة. ثم يخرج إلى الريبوسوم. الترجمة: يقرأ الريبوسوم الكودونات بدءاً من AUG، وتنقل جزيئات tRNA الأحماض الأمينية حسب الشفرة المضادة، وترتبط الأحماض بروابط ببتيدية حتى كودون التوقف.'},{ch:6,q:'قارن بين الصخور النارية الجوفية والبركانية.',a:'الجوفية: تبرد ببطء داخل القشرة فتكون بلوراتها كبيرة خشنة (الجرانيت). البركانية: تبرد بسرعة على السطح فتكون بلوراتها دقيقة (البازلت).'}],
 chemistry:[{ch:0,q:'اكتب معادلات الحصول على أكسيد الحديد (III) من كبريتات الحديد (II).',a:'بالتسخين الشديد:\n2FeSO₄ → Fe₂O₃ + SO₂ + SO₃'},{ch:1,q:'كيف تميز عملياً بين ملح كربونات وملح بيكربونات؟',a:'بإضافة محلول كبريتات الماغنسيوم: الكربونات تعطي راسباً أبيض على البارد، والبيكربونات لا تعطي راسباً إلا بالتسخين.'},{ch:2,q:'وضّح أثر زيادة الضغط على تفاعل تكوين النشادر.\nN₂ + 3H₂ ⇌ 2NH₃',a:'يزيح الاتزان في الاتجاه الطردي (تكوين النشادر) لأنه الاتجاه الذي يقل فيه عدد مولات الغازات (4 مولات → 2 مول)، حسب قاعدة لوشاتلييه.'},{ch:3,q:'لماذا يصدأ الحديد المغطى بالقصدير بسرعة عند خدشه بينما لا يصدأ الحديد المجلفن؟',a:'في الحديد المجلفن الخارصين أنشط فيكون الأنود ويتآكل بدل الحديد. أما مع القصدير فالحديد أنشط منه فيكون هو الأنود ويتآكل بسرعة عند الخدش.'},{ch:4,q:'كيف تفرق عملياً بين الإيثانول والفينول؟',a:'بإضافة محلول هيدروكسيد الصوديوم: الفينول يتفاعل لأنه حمضي ويكوّن فينوكسيد الصوديوم، والإيثانول لا يتفاعل. (أو بكلوريد الحديد III: الفينول يعطي لوناً بنفسجياً).'}],
 physics:[{ch:0,q:'اشرح لماذا تزداد شدة إضاءة المصباح عند غلق دائرة بطارية ذات مقاومة داخلية صغيرة.',a:'لأن التيار I = VB / (R + r)، فكلما صغرت المقاومة الداخلية r زاد التيار المار وزاد الجهد بين طرفي المصباح فتزداد القدرة المستنفدة فيه.'},{ch:1,q:'اشرح كيف يتحول الجلفانومتر إلى أميتر.',a:'بتوصيل مقاومة صغيرة (مجزئ تيار) على التوازي معه، فيمر فيها معظم التيار ويمر في الجلفانومتر أقصى تيار يتحمله فقط، فيمكن قياس تيارات كبيرة.'},{ch:2,q:'لماذا يصنع قلب المحول من شرائح حديدية رقيقة معزولة؟',a:'لتقليل التيارات الدوامية التي تسبب فقد الطاقة في صورة حرارة، فتزداد كفاءة المحول.'},{ch:3,q:'متى تحدث حالة الرنين في دائرة RLC؟ وما خصائصها؟',a:'عندما تتساوى المفاعلة الحثية والسعوية. عندها تكون المعاوقة أقل ما يمكن وتساوي المقاومة الأومية، ويكون التيار أكبر ما يمكن، ويتفق الجهد والتيار في الطور.'},{ch:4,q:'فسر: لا تنبعث إلكترونات من سطح فلز مهما زادت شدة ضوء تردده أقل من التردد الحرج.',a:'لأن طاقة الفوتون الواحد E = hν أقل من دالة الشغل، والإلكترون يمتص فوتوناً واحداً، فزيادة الشدة تزيد عدد الفوتونات لا طاقتها.'},{ch:5,q:'اشرح نشأة الطيف الخطي لذرة الهيدروجين حسب نموذج بور.',a:'عند إثارة الذرة ينتقل الإلكترون لمستوى طاقة أعلى، وعند عودته لمستوى أقل يشع فوتوناً طاقته تساوي فرق الطاقة بين المستويين، ولأن المستويات محددة تظهر خطوط بأطوال موجية محددة.'},{ch:6,q:'ما المقصود بالإسكان المعكوس؟ ولماذا هو ضروري لعمل الليزر؟',a:'أن يكون عدد الذرات في المستوى المثار (شبه المستقر) أكبر من عددها في المستوى الأرضي، وهو ضروري ليغلب الانبعاث المستحث على الامتصاص فيحدث التضخيم.'},{ch:7,q:'اشرح كيف يعمل الدايود موحداً للتيار.',a:'يسمح بمرور التيار في الانحياز الأمامي فقط (البلورة p متصلة بالقطب الموجب)، ويمنعه في الانحياز العكسي، فيمر نصف موجة التيار المتردد فقط.'}],
 puremath:[{ch:0,q:'أوجد الحد الخالي من x في مفكوك `(x² + 1/x)⁶`.',a:'الحد العام: 6Cr × x^(12 − 2r) × x^(−r) = 6Cr × x^(12 − 3r)\nنضع 12 − 3r = 0 فتكون r = 4\nالحد الخالي = 6C4 = 15'},{ch:1,q:'باستخدام نظرية ديموافر أوجد `(1 + i)⁴`.',a:'1 + i = √2 (cos π/4 + i sin π/4)\n(1 + i)⁴ = 4 (cos π + i sin π) = −4'},{ch:2,q:'أوجد قياس الزاوية بين المتجهين (1، 1، 0) و (0، 1، 1).',a:'A · B = 1 ، |A| = |B| = √2\ncos θ = 1 / 2\nθ = 60°'},{ch:3,q:'أوجد معادلة المستوى المار بالنقطة (1، 2، 3) والعمودي على المتجه (2، −1، 1).',a:'2(x − 1) − (y − 2) + (z − 3) = 0\n2x − y + z − 3 = 0'},{ch:4,q:'أوجد معادلة المماس لمنحنى `y = x² + 1` عند النقطة (1، 2).',a:'الميل عند x = 1:\ny′ = 2x = 2\nمعادلة المماس:\ny − 2 = 2 (x − 1)\ny = 2x'},{ch:5,q:'أوجد القيم العظمى والصغرى المحلية للدالة `f(x) = x³ − 3x² + 2`.',a:'f′(x) = 3x² − 6x = 0\nالنقطتان الحرجتان x = 0 و x = 2\nf″(0) = −6 < 0\nإذن قيمة عظمى محلية f(0) = 2\nf″(2) = 6 > 0\nإذن قيمة صغرى محلية f(2) = −2'},{ch:6,q:'أوجد مساحة المنطقة المحصورة بين `y = x²` و `y = x`.',a:'نقطتا التقاطع x = 0 و x = 1\nA = ∫₀¹ (x − x²) dx = 1/2 − 1/3 = 1/6'}],
 appliedmath:[{ch:0,q:'قوة F = (2، −3) تؤثر في النقطة A = (4، 1). أوجد عزمها حول نقطة الأصل.',a:'M = x Fy − y Fx\nM = 4 × (−3) − 1 × 2 = −14\nأي 14 وحدة عزم في اتجاه عقارب الساعة.'},{ch:1,q:'قضيب منتظم طوله 4 م ووزنه 50 نيوتن يرتكز على حاملين عند طرفيه، عُلق به ثقل 30 نيوتن على بعد 1 م من أحد طرفيه. أوجد رد فعل كل حامل.',a:'بأخذ العزوم حول الطرف البعيد عن الثقل:\nR₁ × 4 = 30 × 3 + 50 × 2 ⇒ R₁ = 47.5 نيوتن\nR₂ = 80 − 47.5 = 32.5 نيوتن'},{ch:2,q:'أثبت أن مجموعة القوى المؤثرة في أضلاع مثلث مأخوذة في ترتيب دوري وممثلة بها تماماً تكافئ ازدواجاً.',a:'محصلة القوى = صفر لأنها تكون مضلعاً مغلقاً، ومجموع عزومها حول أي رأس لا يساوي صفراً (يساوي ضعف مساحة المثلث)، إذن تكافئ ازدواجاً عزمه ضعف مساحة المثلث.'},{ch:3,q:'جسيم يتحرك بحيث `a = 6t` وبدأ من السكون من نقطة الأصل. أوجد سرعته وإزاحته عند `t = 2`.',a:'يبدأ من السكون فالثابت صفر:\nv = ∫ 6t dt = 3t²\nv(2) = 12\ns = ∫ 3t² dt = t³\ns(2) = 8'},{ch:4,q:'جسمان 5 كجم و3 كجم متصلان بخيط على بكرة ملساء. أوجد العجلة والشد (g = 9.8).',a:'العجلة بوحدة م/ث² والشد بالنيوتن:\na = (5 − 3) × 9.8 / 8 = 2.45\nT = 2 × 5 × 3 × 9.8 / 8 = 36.75'},{ch:5,q:'سيارة كتلتها 1000 كجم تتحرك بسرعة منتظمة 20 م/ث ضد مقاومة 500 نيوتن. أوجد قدرة محركها.',a:'السرعة منتظمة فالقوة = المقاومة = 500 نيوتن\nP = F v = 500 × 20 = 10000 وات = 10 كيلووات'}],
 history:[{ch:0,q:'وضّح دور رجال الأزهر في مقاومة الحملة الفرنسية.',a:'قادوا ثورة القاهرة الأولى (1798م) والثانية (1800م)، وحرّضوا الشعب على المقاومة، وكان الأزهر مركز الثورة، فدفعوا ثمناً كبيراً حين ضرب الفرنسيون الأزهر بالمدافع.'},{ch:1,q:'ما الأسس التي اعتمد عليها محمد علي في بناء الدولة الحديثة؟',a:'بناء جيش حديث، والتعليم (المدارس والبعثات)، والإصلاح الزراعي (القناطر والترع وزراعة القطن)، والصناعة، والإدارة المركزية، ومطبعة بولاق.'},{ch:2,q:'ما أسباب الثورة العرابية؟',a:'تدخل الدول الأوروبية في شئون مصر بسبب الديون، واستبداد الخديوي توفيق، وتمييز الضباط الشراكسة على المصريين في الجيش، ونمو الوعي القومي.'},{ch:3,q:'ما نتائج ثورة 1919م؟',a:'صدور تصريح 28 فبراير 1922م بالاستقلال المشروط، ثم دستور 1923م، وظهور الوحدة الوطنية، ومشاركة المرأة في العمل الوطني.'},{ch:4,q:'قارن بين أساليب المقاومة في ليبيا والجزائر.',a:'ليبيا: مقاومة مسلحة في الجبال بقيادة عمر المختار ضد الإيطاليين حتى 1931م. الجزائر: مقاومة الأمير عبد القادر ثم ثورة التحرير الشاملة 1954م حتى الاستقلال 1962م.'},{ch:5,q:'ما أثر وعد بلفور على القضية الفلسطينية؟',a:'مهّد لهجرة اليهود إلى فلسطين تحت الانتداب البريطاني، وقيام إسرائيل 1948م، وتشريد الشعب الفلسطيني.'},{ch:6,q:'ما نتائج حرب أكتوبر 1973م؟',a:'تحطيم أسطورة الجيش الذي لا يُقهر، وعبور القناة وتحطيم خط بارليف، واسترداد الكرامة العربية، وفتح الطريق لاسترداد سيناء بالسلام.'},{ch:7,q:'ما أهداف ثورة 25 يناير 2011م؟',a:'عيش، حرية، عدالة اجتماعية، وكرامة إنسانية.'}],
 geography:[{ch:1,q:'وضّح أثر شكل الدولة على قوتها.',a:'الشكل المندمج يسهل الدفاع والاتصال والإدارة، أما المستطيل فتبعد أطرافه عن العاصمة، والمجزأ يصعب الربط بين أجزائه والدفاع عنه.'},{ch:2,q:'ما وظائف الحدود السياسية؟',a:'الوظيفة الدفاعية، والاقتصادية (الجمارك وتنظيم التجارة)، والقانونية (تحديد سيادة الدولة)، وتنظيم حركة الأفراد.'},{ch:3,q:'لماذا تتجه الدول إلى التكتلات الاقتصادية؟',a:'لمواجهة المنافسة العالمية، وتوسيع الأسواق، وإزالة الحواجز الجمركية، وتحقيق التكامل الاقتصادي، وزيادة القوة التفاوضية.'},{ch:4,q:'ما خصائص النظام الدولي بعد انتهاء الحرب الباردة؟',a:'هيمنة القطب الواحد (الولايات المتحدة) ثم صعود قوى جديدة كالصين، وانتشار العولمة والشركات متعددة الجنسيات، وزيادة دور المنظمات الدولية والتكتلات.'}],
 statistics:[{ch:0,q:'احسب معامل ارتباط الرتب لسبيرمان إذا كان `n = 6` و `Σd² = 14`.',a:'r = 1 − 6 × 14 / (6 × 35)\nr = 1 − 84 / 210 = 0.6\nارتباط طردي متوسط.'},{ch:1,q:'للبيانات 3، 5، 7، 8، 10، 12، 15 أوجد الربيعين ونصف المدى الربيعي.',a:'Q₁ = 5 ، Q₂ = 8 ، Q₃ = 12\nنصف المدى الربيعي = (12 − 5) / 2 = 3.5'},{ch:2,q:'إذا كان A و B حدثين مستقلين، `P(A) = 0.6` و `P(B) = 0.5`. أوجد `P(A ∪ B)`.',a:'P(A ∩ B) = 0.6 × 0.5 = 0.3\nP(A ∪ B) = 0.6 + 0.5 − 0.3 = 0.8'},{ch:3,q:'متغير ذو حدين `n = 10` و `p = 0.4`. أوجد التوقع والتباين والانحراف المعياري.',a:'μ = 10 × 0.4 = 4\nσ² = 10 × 0.4 × 0.6 = 2.4\nσ = √2.4 ≈ 1.55'},{ch:4,q:'درجات طلاب تتبع توزيعاً طبيعياً μ = 60 و σ = 8. أوجد القيمة المعيارية لطالب درجته 72، وفسرها.',a:'Z = (72 − 60) / 8 = 1.5\nأي أن درجته أعلى من الوسط بمقدار 1.5 انحراف معياري.'}]
};
const NOTES={
 arabic:[
  {t:'النواسخ',b:'كان وأخواتها ترفع المبتدأ وتنصب الخبر. إنّ وأخواتها تنصب المبتدأ وترفع الخبر. ظنّ وأخواتها تنصب المبتدأ والخبر مفعولين.'},
  {t:'الممنوع من الصرف',b:'يُجر بالفتحة بدل الكسرة ولا يُنوّن، مثل صيغة منتهى الجموع (مساجد، مصابيح)، والعلم الأعجمي، وما خُتم بألف تأنيث.'},
  {t:'مدارس الشعر الحديث',b:'الإحياء والبعث (البارودي وشوقي وحافظ)، ثم مدرسة الديوان (العقاد والمازني وشكري)، ثم جماعة أبولو (أبو شادي وناجي والشابي)، وشعراء المهجر (جبران وإيليا أبو ماضي).'},
  {t:'المرفوعات والمنصوبات والمجرورات',b:'- المرفوعات: الفاعل ونائبه والمبتدأ والخبر واسم كان وخبر إن.\n- المنصوبات: المفاعيل الخمسة والحال والتمييز والمستثنى وخبر كان واسم إن.\n- المجرورات: المجرور بالحرف والمضاف إليه.'},
  {t:'التوابع والأساليب',b:'- التوابع: النعت والتوكيد والعطف والبدل.\n- الأساليب: التعجب، المدح والذم، الاختصاص، الإغراء والتحذير، الشرط، القسم، الاستفهام.'},
  {t:'المشتقات وهمزتا الوصل والقطع',b:'- المشتقات: اسم الفاعل واسم المفعول وصيغ المبالغة والصفة المشبهة واسم التفضيل واسما الزمان والمكان واسم الآلة.\n- همزة الوصل: في الأمر والماضي والمصدر للخماسي والسداسي. همزة القطع: في الرباعي.'},
  {t:'الأدب: مدارس الشعر',b:'- الإحياء والبعث: البارودي رائدها، وشوقي وحافظ، وشوقي رائد جيل التطوير والمسرح الشعري («غربة وحنين» في منفاه بالأندلس).\n- الاتجاه الوجداني: خليل مطران («المساء»).\n- الديوان: العقاد والمازني وشكري، ودعوا إلى الوحدة العضوية.\n- أبولو: أحمد زكي أبو شادي، ومحمود حسن إسماعيل («أهواك يا وطني»).\n- المهجر: الرابطة القلمية (جبران ونعيمة) والعصبة الأندلسية.\n- الشعر الجديد: شعر التفعيلة، و«النسور» لأبو سنة.'},
  {t:'النثر والبلاغة',b:'- المقال: الزيات «التكافل الاجتماعي في الإسلام». الرواية: «زينب» لهيكل. القصة القصيرة: «في القطار» لمحمد تيمور، و«الكنيسة نورت» لأصلان. المسرحية: توفيق الحكيم.\n- التجربة الشعرية: الصورة النفسية أو الكونية الكاملة للشاعر.\n- الوحدة الفنية: وحدة الموضوع ووحدة الجو النفسي.'},
  {t:'القصة: الأيام لطه حسين',b:'- سيرة ذاتية في جزأين: طفولة الصبي في القرية، ثم حياته في الأزهر بالقاهرة.\n- فقد بصره بالرمد وعلاج الحلاق، وحفظ القرآن قبل التاسعة، ثم نسيه فذاق مرارة الفشل.\n- مات أخوه بالكوليرا في الثامنة عشرة، ويخاطب ابنته في نهاية الجزء الأول.\n- في الأزهر: الربع، الحاج علي، درس الأستاذ الإمام محمد عبده، والإقبال على الأدب مع الشيخ المرصفي.'}
 ],
 english:[
  {t:'Conditionals',b:'الشرط الأول: If + مضارع بسيط ثم will. الشرط الثاني: If + ماضٍ بسيط ثم would. الشرط الثالث: If + ماضٍ تام ثم would have + التصريف الثالث.'},
  {t:'Passive voice',b:'المبني للمجهول = فعل be في زمن الجملة + التصريف الثالث. مثال: They clean the room → The room is cleaned.'},
  {t:'Units 1–6: Grammar',b:'- Unit 1: present perfect and present perfect continuous (for / since).\n- Unit 2: reported statements and commands (told him to …).\n- Unit 3: modals for deduction, regret and blame (must have / can’t have / should have + p.p.).\n- Unit 4: adjectives and compound adjectives (a five-day trip).\n- Unit 5: causative have / get (have something done).\n- Unit 6: reported questions (asked if / where …).'},
  {t:'Units 7–12: Grammar',b:'- Unit 7: past perfect and past perfect continuous.\n- Unit 8: active and passive voice.\n- Unit 9: verb patterns (gerund / infinitive).\n- Unit 10: relative clauses (who, which, whose, where).\n- Unit 11: comparative and superlative adjectives.\n- Unit 12: question tags.'}
 ],
 biology:[
  {t:'الفصل 1: الدعامة والحركة',b:'- النبات العشبي يتدعم بالامتلاء، والخشبي باللجنين، والأنسجة الدعامية: الكولنشيمية والإسكلرنشيمية.\n- الهيكل المحوري: الجمجمة والعمود الفقري (33 فقرة) والقفص الصدري (12 زوجاً من الضلوع).\n- المفاصل: ليفية (غير متحركة) وغضروفية (محدودة الحركة) وزلالية (متحركة).\n- الانقباض العضلي: انزلاق الأكتين على الميوسين باستخدام ATP وأيونات الكالسيوم.'},
  {t:'الفصل 2: التنسيق الهرموني',b:'- النخامية سيدة الغدد، وفصها الخلفي يفرز ADH والأوكسيتوسين.\n- الدرقية: الثيروكسين والكالسيتونين، وجارات الدرقية: الباراثورمون.\n- البنكرياس: الأنسولين (بيتا) يخفض السكر، والجلوكاجون (ألفا) يرفعه.\n- الكظرية: القشرة (الألدوستيرون والكورتيزون) واللب (الأدرينالين).\n- هرمونات النبات: الأوكسين (الاستطالة) والجبريلين والسيتوكينين والإيثيلين (النضج).'},
  {t:'الفصل 3: التكاثر',b:'- لاجنسي: الانشطار الثنائي، التبرعم، التجدد، الجراثيم، التوالد البكري، التكاثر الخضري.\n- الإخصاب المزدوج: نواة + بويضة → زيجوت (2n)، ونواة + نواتين قطبيتين → إندوسبرم (3n).\n- الدورة الشهرية: FSH ينضج الحويصلة، و LH يسبب التبويض ويكوّن الجسم الأصفر الذي يفرز البروجسترون.'},
  {t:'الفصل 4: المناعة',b:'- مناعة طبيعية: الجلد والليسوزيم والإنترفيرون والبلعمة.\n- مكتسبة خلطية: الخلايا البائية ← البلازمية ← أجسام مضادة.\n- مكتسبة خلوية: الخلايا التائية (المساعدة والقاتلة والمثبطة)، وتنضج في التيموسية.\n- اللقاح مناعة مكتسبة إيجابية، والمصل مناعة مكتسبة سلبية.'},
  {t:'الفصل 5: الحمض النووي DNA',b:'- جريفث (التحول البكتيري) ← أفري (DNA هو العامل المحول) ← هيرشي وتشيس (البكتيريوفاج).\n- واطسون وكريك: حلزون مزدوج، وقاعدة شارجاف: A = T و G = C.\n- النيوكليوتيدة: فوسفات + سكر ديؤكسي ريبوز + قاعدة نيتروجينية.\n- التضاعف شبه محافظ.'},
  {t:'الفصل 6: تخليق البروتين',b:'- النسخ: RNA بوليميريز يكوّن mRNA في النواة.\n- الترجمة: عند الريبوسوم، tRNA ينقل الأحماض الأمينية حسب الشفرة المضادة.\n- 64 كودوناً: AUG للبدء، و UAA و UAG و UGA للتوقف.\n- الهندسة الوراثية: إنزيمات القطع + البلازميد + الليجيز.'},
  {t:'الفصل 7: علوم الأرض',b:'- مقياس موس: التلك 1 ... الكوارتز 7 ... الماس 10.\n- الصخور: نارية (جرانيت جوفي، بازلت بركاني)، رسوبية (بها حفريات)، متحولة (رخام من الجيري، كوارتزيت من الرملي).\n- التراكيب: الطيات (محدبة ومقعرة) والفوالق وعدم التوافق والقواطع والجدد.'},
  {t:'الهرمونات وتنظيم السكر',b:'الأنسولين يخفض سكر الدم والجلوكاجون يرفعه، وكلاهما من جزر لانجرهانز في البنكرياس. الأدرينالين من نخاع الغدة الكظرية ويرفع السكر وقت الطوارئ.'},
  {t:'من DNA إلى البروتين',b:'النسخ: تكوين mRNA من DNA داخل النواة. الترجمة: قراءة الكودونات في mRNA عند الريبوسوم وتكوين سلسلة الأحماض الأمينية بمساعدة tRNA.'},
  {t:'المناعة',b:'الخلايا البائية تنتج الأجسام المضادة (مناعة خلطية)، والخلايا التائية تهاجم الخلايا المصابة وتنظم الاستجابة (مناعة خلوية).'}
 ],
 chemistry:[
  {t:'الباب 1: العناصر الانتقالية',b:'تبدأ السلسلة الانتقالية الأولى بالإسكانديوم Sc وتنتهي بالخارصين Zn.\n- اللون والبارامغناطيسية سببهما إلكترونات d المفردة.\n- خامات الحديد: المجنتيت Fe₃O₄، الهيماتيت Fe₂O₃، الليمونيت، السيدريت FeCO₃.\nفي الفرن العالي يختزل CO أكاسيد الحديد:\nFe₂O₃ + 3CO → 2Fe + 3CO₂'},
  {t:'الباب 2: التحليل الكيميائي',b:'- الكربونات + HCl المخفف: يتصاعد CO₂ الذي يعكر ماء الجير.\n- الكبريتات + BaCl₂: راسب أبيض BaSO₄ لا يذوب في الأحماض.\n- الكلوريد + AgNO₃: راسب أبيض AgCl.\n- Cu²⁺ مع NaOH: راسب أزرق، و Fe³⁺ مع NaOH: راسب بني محمر.\nفي المعايرة:\nM₁ V₁ / n₁ = M₂ V₂ / n₂'},
  {t:'الباب 3: الاتزان الكيميائي والأيوني',b:'قاعدة لوشاتلييه: إذا أثّر مؤثر على نظام متزن ينشط النظام في الاتجاه الذي يقلل أثر هذا المؤثر. قيمة Kc تتغير بتغير درجة الحرارة فقط، والعامل الحفاز لا يغير موضع الاتزان.\npH = −log [H⁺]\npH + pOH = 14\nKw = [H⁺][OH⁻] = 10⁻¹⁴'},
  {t:'الباب 4: الكيمياء الكهربية',b:'- الخلية الجلفانية تحول الطاقة الكيميائية إلى كهربية. الأكسدة عند الأنود (السالب) والاختزال عند الكاثود (الموجب).\n- الخلية الإلكتروليتية تحول الطاقة الكهربية إلى كيميائية، والكاثود فيها هو القطب السالب.\n- الفاراداي = 96500 كولوم = شحنة مول من الإلكترونات.\nالقوة الدافعة للخلية:\nemf = E(cathode) − E(anode)'},
  {t:'الباب 5: الكيمياء العضوية',b:'- الألكانات `CₙH₂ₙ₊₂` مشبعة، والألكينات `CₙH₂ₙ` بها رابطة ثنائية، والألكاينات `CₙH₂ₙ₋₂` بها رابطة ثلاثية.\n- الكحولات −OH، والألدهيدات −CHO، والأحماض الكربوكسيلية −COOH.\n- الكحول الأولي يتأكسد إلى ألدهيد ثم حمض، والثانوي إلى كيتون.\n- حمض + كحول ⇌ إستر + ماء.'}
 ],
 puremath:[
  {t:'الوحدة 1: نظرية ذات الحدين',b:'عدد حدود مفكوك (x + a)ⁿ يساوي n + 1، والحد العام:\nT(r+1) = nCr × xⁿ⁻ʳ × aʳ\nالنسبة بين حدين متتاليين:\n(T(r+1)) / (T(r)) = (n − r + 1) / r × a / x'},
  {t:'الوحدة 2: الأعداد المركبة',b:'i² = −1\nالصورة المثلثية حيث r المقياس و θ السعة:\nz = r (cos θ + i sin θ)\nنظرية ديموافر:\n(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ\nالجذور التكعيبية للواحد الصحيح 1 و ω و ω²:\n1 + ω + ω² = 0\nω³ = 1'},
  {t:'الوحدة 3: المتجهات في الفراغ',b:'المسافة بين نقطتين:\nd = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²)\nالضرب القياسي (يساوي صفراً للمتجهين المتعامدين):\nA · B = |A| |B| cos θ\nمعيار الضرب الاتجاهي يساوي مساحة متوازي الأضلاع:\n|A × B| = |A| |B| sin θ'},
  {t:'الوحدة 4: المستقيمات والمستويات',b:'معادلة المستقيم الاتجاهية:\nr = A + t d\nمعادلة المستوى ومتجه العمودي عليه (a، b، c):\na x + b y + c z + d = 0\nطول العمود من نقطة على مستوى:\nL = (|a x₁ + b y₁ + c z₁ + d|) / (√(a² + b² + c²))'},
  {t:'الوحدة 5: التفاضل',b:'قاعدة السلسلة والاشتقاق الضمني، وفي المعادلات البارامترية:\ndy/dx = (dy/dt) / (dx/dt)\nمشتقات الدوال الأسية واللوغاريتمية:\nd/dx (aˣ) = aˣ ln a'},
  {t:'الوحدة 6: سلوك الدالة',b:'- إذا كانت المشتقة الأولى موجبة فالدالة تزايدية، وإذا كانت سالبة فالدالة تناقصية.\n- عند انعدام المشتقة الأولى: إذا كانت الثانية سالبة فهي قيمة عظمى محلية، وإذا كانت موجبة فهي صغرى محلية.\n- نقطة الانقلاب: تنعدم عندها المشتقة الثانية وتتغير إشارتها.'},
  {t:'الوحدة 7: التكامل',b:'التكامل بالتجزيء:\n∫ u dv = u v − ∫ v du\nحجم الجسم الناشئ من الدوران حول محور x:\nV = π ∫ y² dx'},
  {t:'قواعد الاشتقاق',b:'أهم قواعد الاشتقاق:\nd/dx (xⁿ) = n xⁿ⁻¹\nd/dx (sin x) = cos x\nd/dx (cos x) = −sin x\nd/dx (eˣ) = eˣ\nd/dx (ln x) = 1 / x'},
  {t:'التكامل',b:'تكامل القوة (بشرط `n ≠ −1`):\n∫ xⁿ dx = xⁿ⁺¹ / (n + 1) + c\nالتكامل المحدد = قيمة الدالة الأصلية عند الحد الأعلى ناقص قيمتها عند الحد الأدنى.'}
 ],
 appliedmath:[
  {t:'الحركة بعجلة منتظمة',b:'معادلات الحركة بعجلة منتظمة:\nv = v₀ + a t\ns = v₀ t + ½ a t²\nv² = v₀² + 2 a s'},
  {t:'العزوم والازدواج',b:'عزم القوة حول نقطة = القوة × البعد العمودي من النقطة إلى خط عملها:\nM = F × d\nالازدواج قوتان متساويتان متضادتان خطا عملهما متوازيان، ومحصلتهما صفر.'},
  {t:'الاحتكاك',b:'قوة الاحتكاك النهائي = معامل الاحتكاك × رد الفعل العمودي:\nF = μ R'},
  {t:'الشغل والطاقة',b:'W = F s cos θ\nKE = ½ m v²\nPE = m g h'},
  {t:'الاستاتيكا',b:'- العزم = القوة × البعد العمودي، ويساوي صفراً إذا مر خط عمل القوة بالنقطة.\n- محصلة قوتين متوازيتين في اتجاه واحد = مجموعهما، ومتضادتين = الفرق بينهما.\n- شرطا الاتزان: المحصلة = صفر، ومجموع العزوم = صفر.\n- عزم الازدواج = F × d، وهو ثابت حول أي نقطة، ولا يتزن الازدواج إلا مع ازدواج.'},
  {t:'الديناميكا',b:'v = dr/dt\na = dv/dt\na = v dv/ds\nالدفع والتغير في كمية الحركة:\nI = F t = m v₂ − m v₁\nعجلة جسمين على بكرة ملساء:\na = (m₁ − m₂) g / (m₁ + m₂)'},
  {t:'الشغل والطاقة والقدرة',b:'W = F s cos θ\nKE = ½ m v²\nPE = m g h\nP = F v\n- 1 كيلووات ساعة = 3.6 × 10⁶ جول، و 1 جول = 10⁷ إرج.'}
 ],
 physics:[
  {t:'الفصل 2: التأثير المغناطيسي للتيار وأجهزة القياس',b:'كثافة الفيض حول سلك مستقيم:\nB = μ I / (2π d)\nداخل ملف حلزوني:\nB = μ N I / L\nالقوة على سلك في مجال:\nF = B I L sin θ\n- الأميتر = جلفانومتر + مجزئ تيار صغير على التوازي.\n- الفولتميتر = جلفانومتر + مضاعف جهد كبير على التوالي.'},
  {t:'الفصل 3: الحث الكهرومغناطيسي',b:'قانون فاراداي:\nemf = −N ΔΦ / Δt\nقاعدة لنز: التيار المستحث يقاوم التغير المسبب له.\nالمحول المثالي:\nVs / Vp = Ns / Np = Ip / Is'},
  {t:'الفصل 4: دوائر التيار المتردد',b:'I_eff = 0.707 I_max\nX_L = 2π f L\nX_C = 1 / (2π f C)\nZ = √(R² + (X_L − X_C)²)\nالرنين عندما `X_L = X_C`.'},
  {t:'الفصل 5: ازدواجية الموجة والجسيم',b:'طاقة الفوتون:\nE = h ν\nطول موجة دي برولي:\nλ = h / (m v)\nالانبعاث الكهروضوئي يحدث فقط إذا كان تردد الضوء أكبر من التردد الحرج للفلز.'},
  {t:'الفصل 6: الأطياف الذرية',b:'طاقة الفوتون المنبعث عند انتقال الإلكترون:\nE = E₂ − E₁\nمتسلسلات الهيدروجين: ليمان (فوق بنفسجية)، بالمر (مرئية)، باشن وبراكيت وفوند (تحت حمراء).'},
  {t:'الفصل 7: الليزر',b:'الليزر يعتمد على الانبعاث المستحث، وشرطه الإسكان المعكوس. شعاعه أحادي الطول الموجي ومترابط ومتوازٍ وعالي الشدة. في ليزر الهيليوم-نيون يصدر الشعاع من ذرات النيون.'},
  {t:'الفصل 8: الإلكترونيات الحديثة',b:'- n-type: تطعيم بعنصر خماسي التكافؤ، والأغلبية إلكترونات.\n- p-type: تطعيم بعنصر ثلاثي التكافؤ، والأغلبية فجوات.\n- الدايود يمرر التيار في اتجاه واحد.\nβ = I_C / I_B'}
 ],
 history:[
  {t:'الفصل 1: الحملة الفرنسية (1798–1801م)',b:'- أبو قير البحرية 1798م دمرت الأسطول الفرنسي.\n- ثورة القاهرة الأولى 1798م والثانية 1800م، واغتيال كليبر 1800م.\n- النتائج العلمية: حجر رشيد وكتاب وصف مصر والمجمع العلمي.'},
  {t:'الفصل 2: بناء الدولة الحديثة',b:'- محمد علي 1805م باختيار الزعماء بقيادة عمر مكرم، ومذبحة القلعة 1811م، وهزيمة فريزر 1807م.\n- تسوية لندن 1840م: الجيش 18 ألفاً.\n- إسماعيل: مجلس شورى النواب 1866م، لقب الخديوي 1867م، افتتاح قناة السويس 1869م.'},
  {t:'الفصل 3: من الثورة العرابية حتى الحرب العالمية الأولى',b:'- مظاهرة عابدين 9 سبتمبر 1881م، والتل الكبير والاحتلال 1882م.\n- دنشواي 1906م، والحزب الوطني (مصطفى كامل) 1907م.\n- الحماية البريطانية 1914م.'},
  {t:'الفصل 4: مصر بعد الحرب العالمية الأولى',b:'- ثورة 1919م، وتصريح 28 فبراير 1922م، ودستور 1923م.\n- معاهدة 1936م، وثورة 23 يوليو 1952م، واتفاقية الجلاء 1954م.'},
  {t:'الفصل 5: المغرب العربي',b:'- الجزائر 1830م (استقلال 1962م)، تونس باردو 1881م (1956م)، ليبيا 1911م (عمر المختار)، المغرب فاس 1912م (1956م).'},
  {t:'الفصل 6: المشرق العربي',b:'- سايكس بيكو 1916م، وعد بلفور 1917م، الانتداب (سان ريمو 1920م).\n- استقلال العراق 1932م.'},
  {t:'الفصل 7: مصر وقضايا العالم العربي',b:'- جامعة الدول العربية 1945م، العدوان الثلاثي 1956م، الاستنزاف 1967–1970م، أكتوبر 1973م.\n- كامب ديفيد 1978م، معاهدة السلام 1979م، استرداد طابا 1989م.'},
  {t:'الفصل 8: ثورتا يناير ويونيو',b:'- ثورة 25 يناير 2011م، وثورة 30 يونيو 2013م، ودستور 2014م.'},
  {t:'مصر في القرن التاسع عشر',b:'الحملة الفرنسية 1798، تولي محمد علي 1805، افتتاح قناة السويس 1869، الثورة العرابية والاحتلال البريطاني 1882.'},

/* ---------- MathML typesetting: turns "I = 40 / 10 = 4 A" into a real stacked fraction ---------- */
const MSUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','ₑ':'e','ₙ':'n','₊':'+','₋':'−','ₓ':'x','ᵢ':'i','ₘ':'m'};
const MSUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','ⁿ':'n','⁺':'+','⁻':'−','ˣ':'x','ᵗ':'t'};
const MFUNCS=/^(sin|cos|tan|ln|log|lim|max|min|mol)$/;
const MUNITS=new Set(['A','V','Ω','C','s','N','W','J','mol','m','g','kg','Hz']);
function mTokens(src){
  const out=[];let i=0;const s=String(src);
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==='_'&&out.length&&/[A-Za-z0-9]/.test(s[i+1]||'')){i++;let t='';while(i<s.length&&/[A-Za-z0-9]/.test(s[i]))t+=s[i++];const p=out[out.length-1];p.sub=(p.sub||'')+t;continue}
    if(MSUB[c]!==undefined||MSUP[c]!==undefined){const k=MSUB[c]!==undefined?'sub':'sup',map=k==='sub'?MSUB:MSUP;let t='';while(i<s.length&&map[s[i]]!==undefined)t+=map[s[i++]];const p=out[out.length-1]||(out.push({t:'mi',v:''}),out[out.length-1]);p[k]=(p[k]||'')+t;continue}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){let t='';while(i<s.length&&/[0-9.]/.test(s[i]))t+=s[i++];out.push({t:'mn',v:t});continue}
    if(/[A-Za-zα-ωΑ-ΩΔΩρμσ]/.test(c)&&c!=='Σ'){let t='';while(i<s.length&&(/[A-Za-zα-ωΑ-Ω]/.test(s[i])&&s[i]!=='Σ'||/[̀-ͯ]/.test(s[i])))t+=s[i++];out.push({t:'mi',v:t});continue}
    out.push({t:'mo',v:c==='-'?'−':c==='*'?'×':c});i++;
  }
  return out;
}
function mGroup(toks){
  const stack=[{kids:[]}];
  for(const tk of toks){
    if(tk.t==='mo'&&(tk.v==='('||tk.v==='[')){stack.push({t:'grp',open:tk.v,kids:[]});continue}
    if(tk.t==='mo'&&(tk.v===')'||tk.v===']')&&stack.length>1){const g=stack.pop();g.close=tk.v;g.sub=tk.sub;g.sup=tk.sup;stack[stack.length-1].kids.push(g);continue}
    stack[stack.length-1].kids.push(tk);
  }
  while(stack.length>1){const g=stack.pop();g.close='';stack[stack.length-1].kids.push(g)}
  return mFrac(stack[0].kids);
}
function mFrac(nodes){
  nodes=nodes.map(n=>n.t==='grp'?{...n,kids:mFrac(n.kids)}:n);
  const out=[];
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];
    if(n.t==='mo'&&n.v==='√'&&nodes[i+1]){out.push({t:'sqrt',x:nodes[++i]});continue}
    if(n.t==='mo'&&n.v==='/'&&out.length&&nodes[i+1]&&!(out[out.length-1].t==='mo')){
      const a=out.pop(),b=nodes[++i];
      if(a.t==='mi'&&a.unit&&b.t==='mi')b.unit=true;
      out.push({t:'frac',a,b});continue}
    if(n.t==='mi'&&MUNITS.has(n.v)&&out.length&&out[out.length-1].t==='mn'&&(i===nodes.length-1||nodes[i+1].t==='mo')){n.unit=true;out.push({t:'sp'})}
    out.push(n);
  }
  return out;
}
const mEsc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mScript(base,n){
  const sb=n.sub?mRow(mGroup(mTokens(n.sub))):'',sp=n.sup?mRow(mGroup(mTokens(n.sup))):'';
  if(n.sub&&n.sup)return `<msubsup>${base}${sb}${sp}</msubsup>`;
  if(n.sub)return `<msub>${base}${sb}</msub>`;
  if(n.sup)return `<msup>${base}${sp}</msup>`;
  return base;
}
function mNode(n,bare){
  switch(n.t){
    case 'mn':return mScript(`<mn>${mEsc(n.v)}</mn>`,n);
    case 'mi':{
      if(/^d[a-z]$/.test(n.v)&&!n.sub&&!n.sup)return `<mi>d</mi><mi>${n.v[1]}</mi>`;
      const normal=n.unit||MFUNCS.test(n.v)||n.v.length>1;
      const fn=MFUNCS.test(n.v)&&n.v!=='mol';
      return mScript(`<mi${normal?' mathvariant="normal"':''}>${mEsc(n.v)}</mi>`,n)+(fn?'<mspace width="0.2em"></mspace>':'');}
    case 'mo':{
      const big=n.v==='∫'||n.v==='Σ';
      const base=`<mo${big?' largeop="true"':''}>${mEsc(n.v)}</mo>`;
      if(big&&(n.sub||n.sup))return mScript(base,n);
      return mScript(base,n);}
    case 'grp':{const inner=mRow(n.kids);if(bare&&n.open==='('&&n.close===')'&&!n.sub&&!n.sup)return inner;return mScript(`<mrow><mo>${n.open}</mo>${inner}<mo>${n.close}</mo></mrow>`,n)}
    case 'frac':return `<mfrac>${mWrap(n.a)}${mWrap(n.b)}</mfrac>`;
    case 'sp':return '<mspace width="0.3em"></mspace>';
    case 'sqrt':return `<msqrt>${mWrap(n.x)}</msqrt>`;
  }
  return '';
}
const mWrap=n=>`<mrow>${mNode(n,true)}</mrow>`;
const mRow=ns=>`<mrow>${ns.map(n=>mNode(n)).join('')}</mrow>`;
function mathml(src,display){
  try{return `<math dir="ltr" display="${display?'block':'inline'}">${mRow(mGroup(mTokens(src)))}</math>`}
  catch(e){return `<bdi dir="ltr">${mEsc(src)}</bdi>`}
}
/* A formula block, and a check for short option texts that are maths (3x², 1 / x, 10 m/s). */
const fm=s=>`<div class="formula">${mathml(s,true)}</div>`;
const looksMath=s=>/^K_c = /.test(s)||!/[؀-ۿ]/.test(s)&&!/[a-z]{2,}/i.test(s.replace(/sin|cos|tan|ln|lim|dx|mol/g,''))&&/[=\/x∫√ⁿ²³]/.test(s);
const optHtml=s=>looksMath(s)?mathml(s,false):`<bdi>${esc(s)}</bdi>`;
const inlineMath=s=>/[=\/∫x]|lim/.test(s)?mathml(s,false):`<bdi class="inline-math" dir="ltr">${esc(s)}</bdi>`;

/* Render text that mixes Arabic with LTR maths: lines in `backticks` or pure-maths lines become LTR formula blocks. */
function rich(text){
  const lines=String(text).replace(/\r/g,'').split('\n');let html='',list=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,(_,m)=>inlineMath(unesc(m))).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  for(let raw of lines){
    const l=raw.trim();
    if(!l){if(list){html+='</ul>';list=false}continue}
    const m=l.match(/^`([^`]+)`$/);
    const pureMath=!/[؀-ۿ]/.test(l)&&/[=+×÷/−\-^√∫Σ≤≥⇒]/.test(l)&&/[0-9a-zA-Zα-ωΩρ]/.test(l)&&l.length<120&&!/[A-Za-z]{4,}[,.:;]?\s+[A-Za-z]{4,}/.test(l);
    if(m||pureMath){if(list){html+='</ul>';list=false}const f=m?m[1]:l;html+=isChem(f)?`<div class="formula chem" dir="ltr">${esc(f)}</div>`:fm(f);continue}
    if(/^[-•*]\s+/.test(l)){if(!list){html+='<ul>';list=true}html+=`<li>${inline(l.replace(/^[-•*]\s+/,''))}</li>`;continue}
    if(list){html+='</ul>';list=false}
    html+=`<p>${inline(l.replace(/^#+\s*/,''))}</p>`;
  }
  if(list)html+='</ul>';return html;
}

function answerPractice(i,j){

  if(ok){const p=load('practice_progress',{});p[i+1]=true;save('practice_progress',p)}

function quickExam(id,mode){state.setup={...state.setup,subject:id,ch:null,mode};go('exams')}

/* ---------- exam setup ---------- */
function renderExamSetup(){
  const S=state.setup;if(!S.subject||!branchSubjects().includes(S.subject))S.subject=branchSubjects().find(x=>x==='physics')||branchSubjects()[2];
  const chs=CHAPTERS[S.subject];if(!chs)S.ch=null;

      <button type="button" class="mode" aria-pressed="${S.mode==='bubble'}" onclick="state.setup.mode='bubble';render()"><b>بابل شيت</b><span>كراسة أسئلة وورقة إجابة منفصلة تظلّل فيها الدوائر.</span></button>
    </div>
    ${S.mode==='bubble'?`<div class="toggle"><div><b style="font-size:14px">تظليل نهائي كالامتحان الحقيقي</b><div class="muted">تظليل دائرتين في نفس السؤال يلغي إجابته.</div></div><button type="button" class="switch" role="switch" aria-checked="${S.strict}" aria-label="تظليل نهائي" onclick="state.setup.strict=!state.setup.strict;render()"></button></div>`:''}

/* ---------- exam engine ---------- */
function makeItems(list){return list.map(q=>{const perm=shuffle([...q.a.keys()]);return{q:q.q,opts:perm.map(i=>q.a[i]),c:perm.indexOf(0),e:q.e,ch:q.ch,src:q}})}
function examPool(){const S=state.setup;return BANK[S.subject].filter(q=>S.ch===null||S.ch===undefined||q.ch===S.ch)}
const chWord=subject=>CHAPTER_WORD[subject]||'الفصل';
function chName(subject,ch){return CHAPTERS[subject]&&ch!=null?`${chWord(subject)} ${ch+1}: ${CHAPTERS[subject][ch]}`:''}
function startExam(pool){
  const S=state.setup,all=examPool();
  const qs=pool||shuffle(all).slice(0,Math.min(S.count,all.length));
  const n=qs.length,seconds=n*SEC_PER_Q;
  exam={subject:S.subject,ch:pool?null:S.ch,mode:S.mode,strict:S.mode==='bubble'&&S.strict,items:makeItems(qs),answers:Array(n).fill(null),second:Array(n).fill(null),flags:Array(n).fill(false),idx:0,tab:'booklet',seconds,startedAt:Date.now(),endsAt:Date.now()+seconds*1000,done:false,seat:''};
  clearInterval(tick);tick=setInterval(tickTimer,1000);
  state.screen='exam';render();window.scrollTo(0,0);
}
function remaining(){return Math.max(0,Math.round((exam.endsAt-Date.now())/1000))}
function tickTimer(){if(!exam||exam.done)return;const r=remaining();const el=document.getElementById('timer');if(el){el.textContent=fmtTime(r);el.classList.toggle('low',r<=60)}if(r<=0)finishExam(true)}
function answeredCount(){return exam.answers.filter(a=>a!==null).length}
function renderExam(){
  const E=exam,n=E.items.length,r=remaining();
  const head=`<div class="exam-head wrap"><div class="row"><div><b>${esc(SUBJECTS[E.subject].name)}</b><div class="muted">${E.mode==='bubble'?'محاكاة البابل شيت':'امتحان تجريبي'} • أجبت ${answeredCount()} من ${n}</div></div><div class="row" style="gap:8px"><span class="timer ${r<=60?'low':''}" id="timer" aria-label="الوقت المتبقي">${fmtTime(r)}</span><button type="button" class="btn soft" style="padding:8px 12px" onclick="askSubmit()">تسليم</button></div></div><div class="progress"><span style="width:${answeredCount()/n*100}%"></span></div>`;
  if(E.mode==='bubble'){
    appEl.innerHTML=head+`<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${E.tab==='booklet'}" onclick="exam.tab='booklet';render();window.scrollTo(0,0)">كراسة الأسئلة</button><button type="button" role="tab" aria-selected="${E.tab==='sheet'}" onclick="exam.tab='sheet';render();window.scrollTo(0,0)">ورقة الإجابة (${answeredCount()}/${n})</button></div></div><div class="screen wrap">${E.tab==='booklet'?bookletHtml():sheetHtml()}</div>`;
    return;
  }
  const it=E.items[E.idx];
  appEl.innerHTML=head+`<div class="qgrid" aria-label="الأسئلة">${E.items.map((x,i)=>`<button type="button" class="qdot ${E.answers[i]!==null?'answered':''} ${i===E.idx?'current':''} ${E.flags[i]?'flagged':''}" aria-label="السؤال ${i+1}" onclick="exam.idx=${i};render()">${i+1}</button>`).join('')}</div></div>
  <div class="screen wrap">
    <div class="card">${chName(E.subject,it.ch)?`<span class="muted">${esc(chName(E.subject,it.ch))}</span>`:''}<div class="row"><span class="pill">السؤال ${E.idx+1} من ${n}</span><button type="button" class="flag" aria-pressed="${E.flags[E.idx]}" onclick="exam.flags[exam.idx]=!exam.flags[exam.idx];render()">⚑ ${E.flags[E.idx]?'معلَّم للمراجعة':'علّم للمراجعة'}</button></div>
      <p class="qtext">${qh(it.q)}</p>${figHtml(it.src)}
      <div class="list">${it.opts.map((o,i)=>`<button type="button" class="opt" aria-pressed="${E.answers[E.idx]===i}" onclick="chooseAnswer(${i})"><span class="k">${LETTERS[i]}</span>${optHtml(o)}</button>`).join('')}</div>
    </div>
    <div class="exam-foot"><button type="button" class="btn ghost" ${E.idx===0?'disabled':''} onclick="exam.idx--;render()">→ السابق</button>${E.idx<n-1?`<button type="button" class="btn" onclick="exam.idx++;render()">التالي ←</button>`:`<button type="button" class="btn" onclick="askSubmit()">تسليم الامتحان</button>`}</div>
    <p class="muted" style="text-align:center">يمكنك الرجوع وتعديل إجاباتك قبل التسليم.</p>
  </div>`;
}
function chooseAnswer(i){exam.answers[exam.idx]=i;render()}
function bookletHtml(){
  return `<div class="card"><p class="muted">اقرأ الأسئلة هنا، ثم ظلّل إجابتك في «ورقة الإجابة». رقم السؤال في الكراسة هو رقم الصف في الورقة.</p>${exam.items.map((it,i)=>`<div class="booklet-q"><div class="row"><b>${i+1}. ${qh(it.q)}</b>${exam.answers[i]!==null?'<span class="pill good">مظلَّل</span>':''}</div>${figHtml(it.src)}<ol>${it.opts.map((o,k)=>`<li><span class="k">${LETTERS[k]})</span>${optHtml(o)}</li>`).join('')}</ol></div>`).join('')}
  <button type="button" class="btn block" onclick="exam.tab='sheet';render();window.scrollTo(0,0)">انتقل إلى ورقة الإجابة</button></div>`;
}
function sheetHtml(){
  const E=exam,rows=E.items.map((it,i)=>{
    const inv=E.second[i]!==null;
    return `<div class="brow ${inv?'invalid':''}"><span class="n">${i+1}</span><span class="bubbles">${LETTERS.map((L,k)=>`<button type="button" class="bub ${E.answers[i]===k||E.second[i]===k?'on':''}" aria-label="السؤال ${i+1} الاختيار ${L}" aria-pressed="${E.answers[i]===k||E.second[i]===k}" onclick="shade(${i},${k})">${L}</button>`).join('')}</span>${inv?'<span class="flagmini">ملغاة</span>':''}</div>`}).join('');
  return `<div class="sheet"><div class="sheet-head"><h3>ورقة الإجابة • امتحان ${esc(SUBJECTS[E.subject].name)} التجريبي</h3>
    <div class="sheet-fields"><label>رقم الجلوس<input class="box" id="seat" inputmode="numeric" maxlength="8" value="${esc(E.seat)}" oninput="exam.seat=this.value" dir="ltr"></label><label>الشعبة<input class="box" value="${esc(BRANCHES[state.branch].name)}" readonly></label></div>
    <p class="sheet-rules">ظلّل دائرة واحدة فقط لكل سؤال تظليلاً كاملاً.${E.strict?' التظليل نهائي: تظليل دائرة ثانية في السؤال نفسه يلغي إجابته.':' يمكنك تغيير التظليل في هذا التدريب.'}</p></div>
    <div class="bubble-cols">${rows}</div></div>
    <button type="button" class="btn block" onclick="askSubmit()">تسليم ورقة الإجابة</button>`;
}
function shade(i,k){
  const E=exam;
  if(E.second[i]!==null)return toast('هذه الإجابة ملغاة بسبب التظليل المزدوج');
  if(E.answers[i]===null)E.answers[i]=k;
  else if(E.answers[i]===k){if(!E.strict)E.answers[i]=null;else return toast('التظليل نهائي ولا يمكن مسحه')}
  else if(E.strict)E.second[i]=k;
  else E.answers[i]=k;
  const y=window.scrollY;render();window.scrollTo(0,y);
}
function askSubmit(){
  const left=exam.items.length-answeredCount(),fl=exam.flags.filter(Boolean).length;
  modal({title:'تسليم الامتحان؟',body:(left?`لم تُجب عن <b>${left}</b> ${left===1?'سؤال':'أسئلة'}. `:'أجبت عن كل الأسئلة. ')+(fl?`وعندك ${fl} معلَّمة للمراجعة. `:'')+'لا يمكن تعديل الإجابات بعد التسليم.',ok:'سلّم الآن',cancel:'ارجع للامتحان',onOk:()=>finishExam(false)});
}
function confirmLeaveExam(){modal({title:'إنهاء الامتحان؟',body:'سيتم تسليم إجاباتك الحالية وحساب النتيجة.',ok:'سلّم وأنهِ',cancel:'أكمل الامتحان',onOk:()=>{finishExam(false);}})}
function finishExam(auto){
  if(!exam||exam.done)return;exam.done=true;clearInterval(tick);tick=null;
  const E=exam,n=E.items.length;
  const rows=E.items.map((it,i)=>{const invalid=E.second[i]!==null,a=E.answers[i];const status=invalid?'invalid':a===null?'skip':a===it.c?'ok':'no';return{...it,a,second:E.second[i],status}});
  const correct=rows.filter(r=>r.status==='ok').length,skipped=rows.filter(r=>r.status==='skip').length,invalid=rows.filter(r=>r.status==='invalid').length,wrong=n-correct-skipped-invalid;
  const secs=Math.min(E.seconds,Math.round((Date.now()-E.startedAt)/1000)),percent=Math.round(correct/n*100);
  seedFromHistory();const added=trackResult(E.subject,rows);
  lastResult={subject:E.subject,ch:E.ch,mode:E.mode,strict:E.strict,rows,correct,wrong,skipped,invalid,total:n,percent,secs,auto,added};
  const h=history();h.unshift({date:new Date().toISOString(),subject:E.subject,ch:E.ch,mode:E.mode,correct,total:n,percent,wrong,skipped,invalid,secs,branch:BRANCHES[state.branch].name,mistakes:rows.filter(r=>r.status!=='ok').map(r=>r.src.q)});save('history',h.slice(0,150));
  state.resultFilter='mistakes';state.screen='result';render();window.scrollTo(0,0);
  if(auto)toast('انتهى الوقت وتم تسليم الامتحان تلقائياً');
}

/* ---------- result ---------- */

    ${R.added?`<p class="note">أُضيف ${qCount(R.added)} إلى «بنك أخطائي» لتراجعها على فترات. <button type="button" class="link" onclick="go('mistakes')">افتح البنك</button></p>`:''}
    ${R.invalid?`<p class="note">${R.invalid} ${R.invalid===1?'إجابة أُلغيت':'إجابات أُلغيت'} بسبب تظليل أكثر من دائرة. في الامتحان الحقيقي تُحسب هذه الأسئلة بلا درجة.</p>`:''}
    <div class="btns">${R.rows.some(r=>r.status!=='ok')?`<button type="button" class="btn" onclick="retryMistakes()">أعد الأسئلة الخاطئة</button>`:''}<button type="button" class="btn soft" onclick="state.setup.subject='${R.subject}';state.setup.ch=${R.ch==null?'null':R.ch};state.setup.mode='${R.mode}';startExam()">امتحان جديد</button></div>
  </div>
  <div class="row"><h2>${state.resultFilter==='all'?'كل الأسئلة':'أخطاؤك'}</h2><div class="choices"><button type="button" class="choice" aria-pressed="${state.resultFilter==='mistakes'}" onclick="state.resultFilter='mistakes';render()">الأخطاء</button><button type="button" class="choice" aria-pressed="${state.resultFilter==='all'}" onclick="state.resultFilter='all';render()">الكل</button></div></div>

/* ---------- weak areas & mistakes bank (v1.0.0) ---------- */
const qKey=(s,q)=>{let h=5381;const t=s+'|'+q.q;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return s+':'+(h>>>0).toString(36)};
let QINDEX=null;
function qIndex(){if(!QINDEX){QINDEX={};for(const[s,qs] of Object.entries(BANK))qs.forEach(q=>{QINDEX[qKey(s,q)]={s,q}})}return QINDEX}
const DAY=864e5,REVIEW_GAP=[0,1,3,7]; // box -> days until next review; a correct answer at box 3 = mastered
function bankData(){const v=load('mbank',{});return v&&typeof v==='object'?v:{}}
function chData(){const v=load('chstats',{});return v&&typeof v==='object'?v:{}}
function seedFromHistory(){
  if(load('mbankSeeded',false))return;
  const bank=bankData(),cs=chData(),idx=qIndex(),h=history();
  h.slice().reverse().forEach(x=>{
    if(!BANK[x.subject])return;
    (x.mistakes||[]).forEach(t=>{const q=BANK[x.subject].find(q=>q.q===t);if(!q)return;const k=qKey(x.subject,q);bank[k]={s:x.subject,box:0,due:Date.parse(x.date)||Date.now(),w:((bank[k]||{}).w||0)+1}});
    if(x.ch!=null&&x.total){const c=(cs[x.subject]=cs[x.subject]||{});const e=(c[x.ch]=c[x.ch]||{n:0,c:0});e.n+=x.total;e.c+=x.correct||0}
  });
  save('mbank',bank);save('chstats',cs);save('mbankSeeded',true);
}
/* called once per finished exam */
function trackResult(subject,rows){
  const bank=bankData(),cs=chData(),now=Date.now();let added=0;
  rows.forEach(r=>{
    const q=r.src;if(!q)return;const ok=r.status==='ok';
    if(q.ch!=null){const c=(cs[subject]=cs[subject]||{});const e=(c[q.ch]=c[q.ch]||{n:0,c:0});e.n++;if(ok)e.c++}
    const k=qKey(subject,q),b=bank[k];
    if(!ok){if(!b||b.box>=4)added++;bank[k]={s:subject,box:0,due:now,w:((b||{}).w||0)+1,last:now}}
    else if(b&&b.box<4&&b.due<=now){b.box++;b.last=now;if(b.box>=4)b.done=now;else b.due=now+REVIEW_GAP[b.box]*DAY}
  });
  save('mbank',bank);save('chstats',cs);return added;
}
function bankItems(subject){const idx=qIndex();return Object.entries(bankData()).filter(([k,b])=>idx[k]&&(!subject||b.s===subject)).map(([k,b])=>({k,...b,q:idx[k].q}))}
function dueItems(subject){const now=Date.now();return bankItems(subject).filter(x=>x.box<4&&x.due<=now)}
function chLevel(acc){return acc<50?['ضعيف','bad']:acc<75?['متوسط','warn']:['جيد','good']}
function weakRows(){
  const cs=chData(),out=[];
  branchSubjects().forEach(s=>{if(!CHAPTERS[s])return;Object.entries(cs[s]||{}).forEach(([ch,e])=>{ch=+ch;if(e.n>=3&&CHAPTERS[s][ch]!==undefined)out.push({s,ch,n:e.n,acc:Math.round(e.c/e.n*100)})})});
  return out.sort((a,b)=>a.acc-b.acc||b.n-a.n);
}
function practiceChapter(s,ch){state.setup={...state.setup,subject:s,ch,mode:'normal',count:10};go('exams')}
function reviewBank(s,ch){
  const items=dueItems(s).filter(x=>ch==null||x.q.ch===ch);if(!items.length){toast('لا توجد أسئلة مستحقة للمراجعة الآن');return}
  state.setup={...state.setup,subject:s,mode:'normal'};startExam(shuffle(items).slice(0,20).map(x=>x.q));
}

function eqParallel(v){return 1/v.reduce((a,b)=>a+1/b,0)}
/* Tiny safe expression parser: + − × ÷ ^ ( ) and variable x. */
function parseExpr(src){
  const s=src.replace(/[×✕]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/س/g,'x').replace(/\s+/g,'');let p=0;
  const peek=()=>s[p];
  function primary(){
    if(peek()==='('){p++;const v=add();if(s[p]!==')')throw 0;p++;return v}
    if(peek()==='-'){p++;const f=pow();return x=>-f(x)}
    if(peek()==='x'){p++;return x=>x}
    const m=s.slice(p).match(/^\d+(\.\d+)?/);if(!m)throw 0;p+=m[0].length;const c=+m[0];return()=>c;
  }
  function pow(){const b=primary();if(peek()==='^'){p++;const e=pow();return x=>Math.pow(b(x),e(x))}return b}
  function mul(){let l=pow();for(;;){const c=peek();if(c==='*'||c==='/'){p++;const r=pow(),L=l;l=c==='*'?x=>L(x)*r(x):x=>L(x)/r(x)}else if(c==='x'||c==='('||(c&&/\d/.test(c))){const r=pow(),L=l;l=x=>L(x)*r(x)}else return l}}
  function add(){let l=mul();while(peek()==='+'||peek()==='-'){const c=s[p++],r=mul(),L=l;l=c==='+'?x=>L(x)+r(x):x=>L(x)-r(x)}return l}
  const f=add();if(p!==s.length)throw 0;return f;
}

}

function tokens(s){return norm(s).replace(/[^؀-ۿa-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.replace(/^(وال|بال|فال|كال|لل|ال)/,'')).filter(w=>w.length>1&&!STOP.has(w))}
function localTutor(text,ctx){
  if(ctx&&ctx.q){const q=ctx.q;const rel=searchKb(q.q+' '+q.a[0],state.tutorSubject).find(h=>!h.q);return{text:'**الإجابة الصحيحة:** '+q.a[0]+'\n'+q.e+(rel?'\n\n**راجع هذه الفكرة — '+rel.t+':**\n'+rel.b:'')+'\n\nنصيحة: اقرأ السؤال مرة ثانية وحدد الكلمة المفتاحية فيه قبل النظر إلى الاختيارات.'}}
  const p=solvePhysics(text);if(p)return{text:p.text+'\n\nجرّب مسألة مشابهة بتغيير الأرقام وتأكد أنك تصل لنفس الخطوات.'};
  const m=solveMath(text);if(m)return m;
  if(/(ذاكر|مذاكر|خطه|اذاكر|تنظيم الوقت)/.test(norm(text)))return{text:'**خطة عملية قبل الامتحان:**\n- قسّم وقتك: جلستان يومياً لكل منهما 90 دقيقة مع راحة 10 دقائق.\n- ابدأ بالمادة الأصعب وأنت في أعلى تركيزك.\n- بعد كل درس حل 5 أسئلة على الأقل، وسجّل أخطاءك.\n- مرة أسبوعياً حل امتحاناً كاملاً بنظام البابل شيت وبالوقت.\n- راجع أخطاءك من «نتائجي» قبل أي امتحان جديد.\nيمكنك إنشاء جدول مقترح من شاشة «جدولي».'};
  const hits=searchKb(text,state.tutorSubject);
  if(hits.length){
    const top=hits.find(h=>!h.q)||hits[0],qhit=hits.find(h=>h.q&&h!==top);
    let extra='';if(qhit)extra=`<details><summary>جرّب سؤالاً مرتبطاً</summary><p>${qh(qhit.q.q)}</p><p class="src">الإجابة: <bdi>${esc(qhit.q.a[0])}</bdi></p></details>`;
    return{text:'**'+top.t+'**\n'+top.b+'\n\nهذه إجابة من ملخصات التطبيق. اسألني بصيغة أخرى أو أعطني مسألة بالأرقام لأحلها خطوة بخطوة.',extra};
  }
  return{text:'لم أجد إجابة لهذا في ملخصات التطبيق.\n- لحل مسألة: اكتبها بالأرقام والوحدات، مثل «مقاومة 4 أوم وفرق جهد 12 فولت».\n- لمعادلة: اكتب مثل «2x + 3 = 11».\n- لدرس: اذكر اسمه، مثل «قانون أوم» أو «النسخ والترجمة».\nالمدرس الذكي الكامل يعمل عند فتح التطبيق داخل Claude.'};
}
function searchKb(text,subject){
  const qt=tokens(text);if(!qt.length)return[];
  return knowledge().map(d=>{const dt=norm(d.t+' '+d.b);let sc=0;qt.forEach(w=>{if(dt.includes(w))sc+=w.length>3?2:1});if(norm(d.t).includes(qt.join(' ')))sc+=3;if(subject!=='general'&&d.s===subject)sc*=1.5;if(subject!=='general'&&d.s!==subject)sc*=.6;return{...d,sc}}).filter(d=>d.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,4);
}

render();
